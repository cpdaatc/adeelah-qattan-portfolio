name: Audit canonical release assets
on:
  push:
    paths:
      - '.github/workflows/audit-canonical-release-assets.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/canonical-20260815
          fetch-depth: 0
      - name: Validate staged portrait candidates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib
          from PIL import Image
          from io import BytesIO

          groups = {
            'canonical-upload': [Path('.canonical-upload')/f'portrait-{i:02}.b64' for i in range(1,7)] + [Path('.canonical-upload/portrait-tail.b64')],
            'release-bin': [Path('.release-bin')/f'portrait-{i:03}.b64' for i in range(1,11)],
            'release12': [Path('.release12')/'portrait-01.b64', Path('.release12')/'portrait-02.b64'],
          }
          expected_binary='0372be80e75f3b0601bf8ff20c0afb7c9a97fbfe6e5106b0d2675106a7e1781d'
          expected_b64='9ea3b42eb62463d0da39c80696014b56df8e8589f9ad255f4df3680e6dca6325'
          for name, files in groups.items():
              present=[p for p in files if p.exists()]
              print(f'\n[{name}] {len(present)}/{len(files)} files')
              if not present: continue
              s=''.join(''.join(p.read_text().split()) for p in present)
              print('chars',len(s),'b64sha',hashlib.sha256(s.encode()).hexdigest())
              try:
                  data=base64.b64decode(s,validate=True)
              except Exception as e:
                  print('DECODE_FAIL',repr(e)); continue
              print('bytes',len(data),'binsha',hashlib.sha256(data).hexdigest(),'jpeg_tail',data[-2:].hex())
              try:
                  im=Image.open(BytesIO(data)); im.verify()
                  im=Image.open(BytesIO(data))
                  print('VALID_IMAGE',im.format,im.size)
              except Exception as e:
                  print('IMAGE_FAIL',repr(e)); continue
              if hashlib.sha256(data).hexdigest()==expected_binary:
                  print('EXACT_CANONICAL_BINARY_MATCH')
              if hashlib.sha256(s.encode()).hexdigest()==expected_b64:
                  print('EXACT_CANONICAL_BASE64_MATCH')
          PY
