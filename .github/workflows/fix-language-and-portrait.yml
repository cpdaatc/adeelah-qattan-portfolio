name: Configure portfolio social preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-language-and-portrait.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Open Graph preview metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = '<!-- SOCIAL_PREVIEW_START -->'
          end = '<!-- SOCIAL_PREVIEW_END -->'
          if start in s and end in s:
              before, rest = s.split(start, 1)
              _, after = rest.split(end, 1)
              s = before + after
          lines = [
              '<!-- SOCIAL_PREVIEW_START -->',
              '<link rel="canonical" href="https://cpdaatc.github.io/adeelah-qattan-portfolio/">',
              '<meta property="og:type" content="website">',
              '<meta property="og:title" content="Dr. Adeelah Talat Qattan — Executive Healthcare Portfolio">',
              '<meta property="og:description" content="Consultant in Restorative Dentistry, Assistant Hospital Director for Academic Affairs, and Director of Medical Education and Training.">',
              '<meta property="og:url" content="https://cpdaatc.github.io/adeelah-qattan-portfolio/">',
              '<meta property="og:image" content="https://cpdaatc.github.io/adeelah-qattan-portfolio/assets/portrait.webp?v=20260813">',
              '<meta property="og:image:secure_url" content="https://cpdaatc.github.io/adeelah-qattan-portfolio/assets/portrait.webp?v=20260813">',
              '<meta property="og:image:type" content="image/webp">',
              '<meta property="og:image:alt" content="Portrait of Dr. Adeelah Talat Qattan">',
              '<meta name="twitter:card" content="summary">',
              '<meta name="twitter:title" content="Dr. Adeelah Talat Qattan — Executive Healthcare Portfolio">',
              '<meta name="twitter:description" content="Consultant in Restorative Dentistry, Assistant Hospital Director for Academic Affairs, and Director of Medical Education and Training.">',
              '<meta name="twitter:image" content="https://cpdaatc.github.io/adeelah-qattan-portfolio/assets/portrait.webp?v=20260813">',
              '<meta name="twitter:image:alt" content="Portrait of Dr. Adeelah Talat Qattan">',
              '<!-- SOCIAL_PREVIEW_END -->',
          ]
          block = '\n  '.join(lines)
          anchor = '<title>Dr. Adeelah Talat Qattan — Executive Healthcare Portfolio</title>'
          if anchor not in s:
              raise SystemExit('title anchor not found')
          s = s.replace(anchor, anchor + '\n  ' + block, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify preview metadata
        run: |
          grep -q 'property="og:image"' index.html
          grep -q 'name="twitter:image"' index.html
          grep -q 'assets/portrait.webp' index.html
      - name: Commit preview metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: show Adeelah portrait in shared link preview"
          git push
