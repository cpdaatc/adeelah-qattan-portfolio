name: Fix broken images and mobile downloads

on:
  push:
    paths:
      - '.github/workflows/fix-broken-images-and-mobile-downloads.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix mobile download button contrast and cache-bust image assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          if '.mobile-panel .btn-primary{color:#fff!important}' not in t:
              t=t.replace('.mobile-panel a{display:block;text-decoration:none;color:var(--teal-950);', '.mobile-panel a{display:block;text-decoration:none;color:var(--teal-950);')
              t=t.replace('html[dir="rtl"] .mobile-panel{transform:translateX(-105%)}', '.mobile-panel .btn-primary{color:#fff!important}.mobile-panel .btn-ghost{color:var(--teal-950)!important}html[dir="rtl"] .mobile-panel{transform:translateX(-105%)}')
          t=t.replace('assets/Dr_Adeelah_Qattan_Portrait_High_Resolution.jpg" download', 'assets/Dr_Adeelah_Qattan_Portrait_High_Resolution.jpg?v=20260814-2" download')
          t=t.replace('assets/King_Fahd_Medal_Third_Degree_2019.jpg" alt=', 'assets/King_Fahd_Medal_Third_Degree_2019.jpg?v=20260814-2" alt=')
          p.write_text(t,encoding='utf-8')
          PY
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          assert '.mobile-panel .btn-primary{color:#fff!important}' in t
          assert 'Download CV (PDF)' in t and 'تحميل السيرة الذاتية (PDF)' in t
          assert 'Download Personal Photo' in t and 'تحميل الصورة الشخصية' in t
          assert 'Download Speaker Bio (PDF)' in t and 'تحميل النبذة التعريفية (PDF)' in t
          print('mobile labels and contrast verified')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: restore mobile download labels and cache bust images'
          git push origin HEAD:main
