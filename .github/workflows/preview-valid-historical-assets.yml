name: Preview valid historical image assets

on:
  push:
    paths:
      - '.github/workflows/preview-valid-historical-assets.yml'

permissions:
  contents: read

env:
  PORTRAIT_BLOB: 732e308023ed5b5e63c4a61683bfe643fcad35b4
  CERT_BLOB: c7f81792a9809e930987561d77febc7b855b9a5f

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install image tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
      - name: Extract and render mobile previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-preview
          git cat-file blob "$PORTRAIT_BLOB" > /tmp/portrait.jpg
          git cat-file blob "$CERT_BLOB" > /tmp/certificate.jpg
          identify /tmp/portrait.jpg
          identify /tmp/certificate.jpg
          convert /tmp/portrait.jpg -resize '340x340>' -background white -gravity center -extent 390x430 audit-preview/portrait-mobile.png || true
          convert /tmp/certificate.jpg -resize '310x>' -background '#0F3D44' -gravity center -extent 390x960 audit-preview/certificate-mobile.png
          test -s audit-preview/portrait-mobile.png
          test -s audit-preview/certificate-mobile.png
      - uses: actions/upload-artifact@v4
        with:
          name: valid-historical-image-previews
          path: audit-preview/*.png
          if-no-files-found: error
