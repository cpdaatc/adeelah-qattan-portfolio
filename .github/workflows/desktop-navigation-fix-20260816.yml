name: Desktop navigation drawer fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-navigation-fix-20260816.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RED — verify the regression test fails before the fix
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          required = [
              '/* DESKTOP-NAV-DRAWER-FIX-20260816 */',
              '@media(min-width:981px)',
              'aria-controls="mobilePanel" aria-expanded="false"',
              "document.addEventListener('keydown'",
          ]
          missing = [item for item in required if item not in html]
          if missing:
              print('Expected RED: desktop drawer requirements are not implemented yet:')
              for item in missing:
                  print(' -', item)
              raise SystemExit(1)
          print('Unexpected: regression test already passes.')
          PY
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'The pre-fix regression test unexpectedly passed; refusing to patch blindly.'
            exit 1
          fi
          echo 'RED confirmed: current desktop implementation reproduces the missing-menu defect.'

      - name: Apply minimal desktop drawer fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = '/* DESKTOP-NAV-DRAWER-FIX-20260816 */'

          if marker not in html:
              css = r'''
    /* DESKTOP-NAV-DRAWER-FIX-20260816 */
    .menu-btn[aria-expanded="true"] span{opacity:0}
    .menu-btn[aria-expanded="true"]:before{transform:rotate(45deg)}
    .menu-btn[aria-expanded="true"]:after{transform:rotate(-45deg)}
    @media(min-width:981px){
      .menu-btn{display:inline-flex!important;position:relative}
      .mobile-panel{display:block!important;position:fixed;z-index:850;top:88px;right:24px;left:auto;width:min(370px,calc(100vw - 48px));max-height:calc(100vh - 112px);overflow-y:auto;padding:20px;background:rgba(252,253,253,.98);border:1px solid rgba(15,61,68,.12);border-radius:18px;box-shadow:0 24px 70px rgba(15,61,68,.18);opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-10px) scale(.985);transform-origin:top right;transition:opacity .22s var(--ease),transform .22s var(--ease),visibility .22s}
      .mobile-panel.open{opacity:1;visibility:visible;pointer-events:auto;transform:none}
      .mobile-panel>a{display:block;text-decoration:none;color:var(--teal-950);font:600 .86rem/1.42 Outfit,sans-serif;padding:9px 2px;border-bottom:1px solid var(--line)}
      .mobile-panel>a:hover{color:var(--teal-600)}
      .mobile-panel .sidebar-downloads{gap:8px;margin-top:16px}
      .mobile-panel .sidebar-downloads .resource-download{display:flex!important;width:100%;min-height:44px!important;height:auto!important;padding:9px 12px!important;border-radius:12px!important;font:600 .76rem/1.3 Outfit,sans-serif!important;white-space:normal;text-align:center;box-shadow:0 8px 18px rgba(15,61,68,.1)!important}
      html[lang="ar"] .mobile-panel>a,html[lang="ar"] .mobile-panel .sidebar-downloads .resource-download{font-family:"Noto Kufi Arabic",sans-serif!important}
      html[dir="rtl"] .mobile-panel{right:auto;left:24px;transform-origin:top left}
      html[dir="rtl"] .mobile-panel.open{transform:none}
      body.menu-open{overflow:auto}
    }
'''
              anchor = '/* MOBILE-UX-REFINEMENT-FINAL */'
              if anchor not in html:
                  raise SystemExit(f'Patch anchor not found: {anchor}')
              html = html.replace(anchor, css + '\n' + anchor, 1)

          old_button = '<button class="control menu-btn" id="menuBtn" aria-label="Open menu"><span></span></button>'
          new_button = '<button class="control menu-btn" id="menuBtn" aria-label="Open menu" aria-controls="mobilePanel" aria-expanded="false"><span></span></button>'
          if old_button in html:
              html = html.replace(old_button, new_button, 1)
          elif new_button not in html:
              raise SystemExit('menuBtn markup did not match the expected canonical structure')

          old_link_handler = "mobile.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{mobile.classList.remove('open');document.body.classList.remove('menu-open')}));"
          new_link_handler = "mobile.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{mobile.classList.remove('open');document.body.classList.remove('menu-open');menuBtn.setAttribute('aria-expanded','false')}));"
          if old_link_handler in html:
              html = html.replace(old_link_handler, new_link_handler, 1)
          elif new_link_handler not in html:
              raise SystemExit('mobile link close handler did not match the expected canonical structure')

          outside_and_escape = """\n    document.addEventListener('click',e=>{if(!mobile.classList.contains('open')||mobile.contains(e.target)||menuBtn.contains(e.target))return;mobile.classList.remove('open');document.body.classList.remove('menu-open');menuBtn.setAttribute('aria-expanded','false')});\n    document.addEventListener('keydown',e=>{if(e.key!=='Escape'||!mobile.classList.contains('open'))return;mobile.classList.remove('open');document.body.classList.remove('menu-open');menuBtn.setAttribute('aria-expanded','false');menuBtn.focus()});"""
          if "document.addEventListener('keydown'" not in html:
              anchor_js = new_link_handler
              if anchor_js not in html:
                  raise SystemExit('JS insertion anchor not found')
              html = html.replace(anchor_js, anchor_js + outside_and_escape, 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: GREEN — structural and responsive regression checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')

          checks = {
              'desktop fix marker': '/* DESKTOP-NAV-DRAWER-FIX-20260816 */' in html,
              'desktop breakpoint': '@media(min-width:981px)' in html,
              'desktop menu visible': '.menu-btn{display:inline-flex!important;position:relative}' in html,
              'desktop panel opens': '.mobile-panel.open{opacity:1;visibility:visible;pointer-events:auto;transform:none}' in html,
              'desktop panel scroll-safe': 'max-height:calc(100vh - 112px);overflow-y:auto' in html,
              'RTL desktop placement': 'html[dir="rtl"] .mobile-panel{right:auto;left:24px;transform-origin:top left}' in html,
              'mobile breakpoint preserved': '@media(max-width:980px)' in html,
              'menu accessibility state': 'aria-controls="mobilePanel" aria-expanded="false"' in html,
              'escape close support': "document.addEventListener('keydown'" in html,
              'outside-click close support': "document.addEventListener('click'" in html,
              'download resources retained': html.count('resource-download') >= 5,
              'single menu button': html.count('id="menuBtn"') == 1,
              'single menu panel': html.count('id="mobilePanel"') == 1,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL'), '-', name)
          if failed:
              raise SystemExit('Failed checks: ' + ', '.join(failed))
          PY

      - name: Serve smoke test
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/adeelah-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/tmp/index-smoke.html; then
              break
            fi
            sleep 0.25
          done
          grep -q 'DESKTOP-NAV-DRAWER-FIX-20260816' /tmp/index-smoke.html
          grep -q 'id="mobilePanel"' /tmp/index-smoke.html
          grep -q 'aria-controls="mobilePanel"' /tmp/index-smoke.html
          echo 'PASS - local HTTP smoke test'

      - name: Commit verified fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: expose navigation and downloads on desktop'
          git push origin HEAD:main
