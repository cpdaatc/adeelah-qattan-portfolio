name: Reconstruct staged portrait

on:
  push:
    paths:
      - '.github/workflows/reconstruct-staged-portrait.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct portrait candidate
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .canonical-release/portrait-display-01.b64 \
            .canonical-release/portrait-display-02.b64 \
            .canonical-release/portrait-display.b64 \
            .canonical-release/portrait-display-04.b64 \
            .canonical-release/portrait-display-05.b64 \
            .canonical-release/portrait-display-06.b64 \
            | tr -d '\r\n\t ' > /tmp/portrait.b64
          base64 -d /tmp/portrait.b64 > portrait-candidate.jpg
          sha256sum portrait-candidate.jpg
          python3 - <<'PY'
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES=False
          p='portrait-candidate.jpg'
          im=Image.open(p); im.verify()
          im=Image.open(p).convert('RGB')
          print('SIZE',im.size)
          im.thumbnail((800,800), Image.Resampling.LANCZOS)
          im.save('portrait-candidate.png')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reconstructed-portrait-candidate
          path: portrait-candidate.*
          if-no-files-found: error
