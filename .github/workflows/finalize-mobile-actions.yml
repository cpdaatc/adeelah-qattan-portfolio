name: Finalize mobile actions

on:
  push:
    paths:
      - '.github/workflows/finalize-mobile-actions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update real portfolio actions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          t = p.read_text(encoding='utf-8')

          # Make the royal-honour action unmistakably interactive.
          t = t.replace(
              '<a href="#royal" class="btn btn-primary"><span class="en">View Royal Honour</span><span class="ar">عرض التكريم الملكي</span></a>',
              '<a href="#royal" class="btn btn-primary"><span class="action-icon" aria-hidden="true">🏅</span><span class="en">View Royal Honour</span><span class="ar">عرض التكريم الملكي</span></a>'
          )

          # Rebuild sidebar action area with one consistent visual system.
          block_pattern = r'<div class="sidebar-downloads">.*?</div>\n  </div>\n\n  <header class="hero"'
          block_replacement = '''<div class="sidebar-downloads">
      <a class="btn btn-primary resource-download" href="#royal"><span class="action-icon" aria-hidden="true">🏅</span><span class="en">View Royal Honour</span><span class="ar">عرض التكريم الملكي</span></a>
      <a class="btn btn-primary resource-download" href="assets/portrait.webp?v=20260814-9" download="Dr_Adeelah_Qattan_Portrait.webp"><span class="action-icon" aria-hidden="true">🖼️</span><span class="en">Download Personal Photo</span><span class="ar">تحميل الصورة الشخصية</span></a>
      <a class="btn btn-primary resource-download" href="assets/Dr_Adeelah_Qattan_Speaker_Bio_Bilingual.pdf?v=20260814-9" download><span class="action-icon" aria-hidden="true">📄</span><span class="en">Download Speaker Bio (PDF)</span><span class="ar">تحميل النبذة التعريفية (PDF)</span></a>
      <a class="btn btn-primary resource-download" href="assets/Dr_Adeelah_Qattan_CV_2026.pdf?v=20260814-9" download><span class="action-icon" aria-hidden="true">📘</span><span class="en">Download CV (PDF)</span><span class="ar">تحميل السيرة الذاتية (PDF)</span></a>
    </div>
  </div>

  <header class="hero"'''
          t, n = re.subn(block_pattern, block_replacement, t, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('sidebar action block not found')

          # Ensure all call-to-action buttons have the same interaction treatment.
          if '.hero-actions .action-icon{' not in t:
              t = t.replace(
                  '.sidebar-downloads .action-icon{font-size:1.05rem;line-height:1}',
                  '.sidebar-downloads .action-icon{font-size:1.05rem;line-height:1}.hero-actions .action-icon{font-size:1.05rem;line-height:1}'
              )

          p.write_text(t, encoding='utf-8')
          PY

      - name: Verify bilingual parity and required content
        run: |
          python - <<'PY'
          from pathlib import Path
          t = Path('index.html').read_text(encoding='utf-8')
          required = [
              '🏅', '🖼️', '📄', '📘',
              'View Royal Honour', 'عرض التكريم الملكي',
              'Download Personal Photo', 'تحميل الصورة الشخصية',
              'Download Speaker Bio (PDF)', 'تحميل النبذة التعريفية (PDF)',
              'Download CV (PDF)', 'تحميل السيرة الذاتية (PDF)',
              'Conference Committee Chair', 'رئيسة لجنة المؤتمر',
              '5th Medical Education Leadership Summit', 'قمة قيادات التعليم الطبي الخامسة',
              'atqattan@hotmail.com', 'adeelahqattan@gmail.com',
              'html[lang="en"] .ar{display:none!important}',
              'html[lang="ar"] .en{display:none!important}'
          ]
          for item in required:
              assert item in t, item
          assert 'assets/portrait.webp?v=20260814-9' in t
          assert 'assets/Dr_Adeelah_Qattan_CV_2026.pdf?v=20260814-9' in t
          print('portfolio action and bilingual verification passed')
          PY

      - name: Commit and clean one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: unify portfolio action buttons and working photo download'
          git push origin HEAD:main
