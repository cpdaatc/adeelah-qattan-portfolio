name: Inspect current portrait
on:
  push:
    paths:
      - '.github/workflows/inspect-current-portrait.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install imaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
      - name: Verify and render
        run: |
          set -euo pipefail
          identify assets/portrait.jpg
          convert assets/portrait.jpg portrait-current.png
          identify portrait-current.png
      - uses: actions/upload-artifact@v4
        with:
          name: current-portrait-png
          path: portrait-current.png
          if-no-files-found: error
