name: Repair portfolio assets and actions

on:
  push:
    paths:
      - '.github/workflows/repair-portfolio-assets-and-actions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified image assets from repository history
        shell: bash
        run: |
          set -euo pipefail
          # Approved high-quality portrait already preserved in Git history.
          gh api "/repos/${GITHUB_REPOSITORY}/git/blobs/732e308023ed5b5e63c4a61683bfe643fcad35b4" --jq '.content' | tr -d '\n' | base64 -d > assets/portrait.jpg
          test "$(git hash-object assets/portrait.jpg)" = "732e308023ed5b5e63c4a61683bfe643fcad35b4"

          # Restore the pre-corruption full King Fahd Medal certificate asset.
          gh api "/repos/${GITHUB_REPOSITORY}/git/blobs/c7f81792a9809e930987561d77febc7b855b9a5f" --jq '.content' | tr -d '\n' | base64 -d > assets/King_Fahd_Medal_Third_Degree_2019.jpg
          test "$(git hash-object assets/King_Fahd_Medal_Third_Degree_2019.jpg)" = "c7f81792a9809e930987561d77febc7b855b9a5f"

      - name: Repair portrait reference, certificate display and missing print action
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          t = p.read_text(encoding='utf-8')

          # 1) The visible portrait was still pointing to the old low-resolution WEBP.
          t = re.sub(r'assets/portrait\.webp(?:\?v=[^"\']+)?',
                     'assets/portrait.jpg?v=20260814-portrait-final', t)
          t = t.replace('download="Dr_Adeelah_Qattan_Portrait.webp"',
                        'download="Dr_Adeelah_Qattan_Portrait.jpg"')

          # 2) Force the Royal Honour section to use the restored full certificate.
          t = re.sub(r'assets/King_Fahd_Medal_Third_Degree_2019\.jpg(?:\?v=[^"\']+)?',
                     'assets/King_Fahd_Medal_Third_Degree_2019.jpg?v=20260814-certificate-final', t)
          t = re.sub(r'\.royal-document img\{([^}]*)\}',
                     lambda m: '.royal-document img{' + re.sub(r'aspect-ratio:[^;]+;?', '', m.group(1)).replace('object-fit:cover', 'object-fit:contain') + '}',
                     t, count=1)

          # 3) Restore the missing Print / Save CV action in the hero.
          hero_match = re.search(r'(<div class="hero-actions">)(.*?)(</div>)', t, flags=re.S)
          if not hero_match:
              raise SystemExit('hero-actions block not found')
          hero_body = hero_match.group(2)
          if 'window.print()' not in hero_body:
              print_btn = '''\n          <button class="btn btn-ghost" type="button" onclick="window.print()"><span class="action-icon" aria-hidden="true">🖨️</span><span class="en">Print / Save CV</span><span class="ar">طباعة / حفظ السيرة</span></button>'''
              replacement = hero_match.group(1) + hero_body + print_btn + '\n        ' + hero_match.group(3)
              t = t[:hero_match.start()] + replacement + t[hero_match.end():]

          # 4) Restore the same action inside the mobile action list.
          panel_start = t.index('<div class="mobile-panel" id="mobilePanel">')
          panel_end = t.index('</div>\n\n  <header class="hero"', panel_start)
          panel = t[panel_start:panel_end]
          if 'onclick="window.print()"' not in panel:
              cv_link = re.search(r'(\s*<a class="btn btn-primary resource-download" href="assets/Dr_Adeelah_Qattan_CV_2026\.pdf[^\n]+</a>)', panel)
              if not cv_link:
                  raise SystemExit('mobile CV download link not found')
              print_mobile = '''\n      <button class="btn btn-primary resource-download" type="button" onclick="window.print()"><span class="action-icon" aria-hidden="true">🖨️</span><span class="en">Print / Save CV</span><span class="ar">طباعة / حفظ السيرة</span></button>'''
              panel = panel[:cv_link.end()] + print_mobile + panel[cv_link.end():]
              t = t[:panel_start] + panel + t[panel_end:]

          p.write_text(t, encoding='utf-8')
          PY

      - name: Verify repaired state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          t = Path('index.html').read_text(encoding='utf-8')
          assert 'assets/portrait.webp' not in t
          assert 'assets/portrait.jpg?v=20260814-portrait-final' in t
          assert 'Dr_Adeelah_Qattan_Portrait.jpg' in t
          assert 'King_Fahd_Medal_Third_Degree_2019.jpg?v=20260814-certificate-final' in t
          assert 'King_Fahd_Medal_Closeup_2019.jpg' not in t[t.index('<section class="royal" id="royal">'):t.index('</section>', t.index('<section class="royal" id="royal">'))]
          assert t.count('onclick="window.print()"') >= 2
          assert 'Print / Save CV' in t
          assert 'طباعة / حفظ السيرة' in t
          print('portfolio asset/action checks passed')
          PY
          test "$(git hash-object assets/portrait.jpg)" = "732e308023ed5b5e63c4a61683bfe643fcad35b4"
          test "$(git hash-object assets/King_Fahd_Medal_Third_Degree_2019.jpg)" = "c7f81792a9809e930987561d77febc7b855b9a5f"

      - name: Commit repaired portfolio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/portrait.jpg assets/King_Fahd_Medal_Third_Degree_2019.jpg
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix: restore portrait, certificate and print action'
          git push origin HEAD:main
