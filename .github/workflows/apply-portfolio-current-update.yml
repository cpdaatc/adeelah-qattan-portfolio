name: Apply portfolio current update
on:
  push:
    paths:
      - '.github/workflows/apply-portfolio-current-update.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update portfolio
        run: python scripts/update_portfolio_current.py
      - name: Generate PDF downloads
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          "$BROWSER" --headless --no-sandbox --disable-gpu --allow-file-access-from-files --no-pdf-header-footer --print-to-pdf="$PWD/assets/Dr_Adeelah_Qattan_CV_2026.pdf" "file://$PWD/tools/cv-download-source.html"
          "$BROWSER" --headless --no-sandbox --disable-gpu --allow-file-access-from-files --no-pdf-header-footer --print-to-pdf="$PWD/assets/Dr_Adeelah_Qattan_Speaker_Bio_Bilingual.pdf" "file://$PWD/tools/speaker-bio-source.html"
          test -s assets/Dr_Adeelah_Qattan_CV_2026.pdf
          test -s assets/Dr_Adeelah_Qattan_Speaker_Bio_Bilingual.pdf
          test $(stat -c%s assets/Dr_Adeelah_Qattan_CV_2026.pdf) -gt 20000
          test $(stat -c%s assets/Dr_Adeelah_Qattan_Speaker_Bio_Bilingual.pdf) -gt 10000
          if command -v pdfinfo >/dev/null 2>&1; then
            test "$(pdfinfo assets/Dr_Adeelah_Qattan_CV_2026.pdf | awk '/^Pages:/{print $2}')" = "2"
            test "$(pdfinfo assets/Dr_Adeelah_Qattan_Speaker_Bio_Bilingual.pdf | awk '/^Pages:/{print $2}')" = "1"
          fi
      - name: Verify downloadable resources
        run: |
          grep -q 'Download CV (PDF)' index.html
          grep -q 'تحميل السيرة الذاتية (PDF)' index.html
          grep -q 'Download Personal Photo' index.html
          grep -q 'تحميل الصورة الشخصية' index.html
          grep -q 'Download Speaker Bio (PDF)' index.html
          grep -q 'تحميل النبذة التعريفية (PDF)' index.html
          grep -q 'Mumaris+: atqattan@hotmail.com' index.html
          grep -q 'Additional Email: adeelahqattan@gmail.com' index.html
          grep -q 'King_Fahd_Medal_Third_Degree_2019.jpg' index.html
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/Dr_Adeelah_Qattan_CV_2026.pdf assets/Dr_Adeelah_Qattan_Speaker_Bio_Bilingual.pdf
          git commit -m 'feat: publish updated roles medal and bilingual downloads'
          git push origin HEAD:main
