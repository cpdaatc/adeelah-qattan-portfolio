name: Audit current portfolio assets

on:
  push:
    paths:
      - '.github/workflows/audit-current-release.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install audit tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils imagemagick
      - name: Inspect canonical assets
        shell: bash
        run: |
          set -euo pipefail
          echo '--- FILE METADATA ---'
          file assets/Dr_Adeelah_Qattan_Portrait_Original.jpg
          identify assets/Dr_Adeelah_Qattan_Portrait_Original.jpg
          file assets/King_Fahd_Medal_Certificate_Full_2019.jpg
          identify assets/King_Fahd_Medal_Certificate_Full_2019.jpg
          file assets/Dr_Adeelah_Qattan_CV_2026.pdf
          pdfinfo assets/Dr_Adeelah_Qattan_CV_2026.pdf | grep -E 'Pages|Page size'
          pdftotext assets/Dr_Adeelah_Qattan_CV_2026.pdf /tmp/cv.txt
          echo '--- CV REQUIRED TOKENS ---'
          for token in \
            'atqattan@hotmail.com' \
            'adeelahqattan@gmail.com' \
            '2nd Medical Education Conference' \
            'Healthcare Artificial Intelligence' \
            '3rd Medical Education Conference' \
            'Innovation in Medical Education' \
            '4th Medical Education Conference' \
            'AI and Medical Education: Partnership for Resilient Healthcare' \
            '5th Medical Education Leadership Summit' \
            'From Innovation to Measurable Impact and Sustainable System' \
            'From AI to Responsible Intelligence' \
            'Conference Committee Chair'; do
              grep -Fq "$token" /tmp/cv.txt || { echo "FAIL: $token"; exit 1; }
              echo "PASS: $token"
          done
          pdftotext assets/Dr_Adeelah_Qattan_Speaker_Bio_Bilingual.pdf /tmp/bio.txt
          grep -Fq 'leadership experience in medical education' /tmp/bio.txt
          grep -Fq 'women' /tmp/bio.txt
          echo 'PASS: current speaker bio contains required English content'
      - name: Build visual audit previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-preview
          convert assets/Dr_Adeelah_Qattan_Portrait_Original.jpg -resize '340x340>' -background white -gravity center -extent 390x430 audit-preview/portrait-mobile.png
          convert assets/King_Fahd_Medal_Certificate_Full_2019.jpg -resize '310x>' -background '#0F3D44' -gravity center -extent 390x960 audit-preview/certificate-mobile.png
      - uses: actions/upload-artifact@v4
        with:
          name: current-asset-visual-audit
          path: audit-preview/*.png
          if-no-files-found: error
