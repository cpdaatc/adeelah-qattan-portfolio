name: Improve medal clarity
on:
  push:
    paths:
      - '.github/workflows/improve-medal-clarity.yml'
permissions:
  contents: write
jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update medal presentation
        run: python scripts/improve_medal_clarity.py
      - name: Verify
        run: |
          grep -q 'royal-image-link' index.html
          grep -q 'اضغط على الصورة لعرضها بالحجم الكامل والتكبير' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: enlarge medal and enable full-size zoom view'
          git push origin HEAD:main
