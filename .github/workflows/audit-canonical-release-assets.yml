name: Audit canonical release assets
on:
  push:
    paths:
      - '.github/workflows/audit-canonical-release-assets.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/canonical-20260815
          fetch-depth: 0
      - name: Audit existing staged portrait pieces
        shell: bash
        run: |
          set -euo pipefail
          echo '--- canonical-upload ---'
          ls -la .canonical-upload || true
          for f in .canonical-upload/portrait-01.b64 .canonical-upload/portrait-02.b64 .canonical-upload/portrait-03.b64 .canonical-upload/portrait-04.b64 .canonical-upload/portrait-05.b64 .canonical-upload/portrait-06.b64; do
            [ -f "$f" ] || continue
            tr -d '\r\n\t ' < "$f" > /tmp/one.b64
            echo "$(basename "$f") chars=$(wc -c < /tmp/one.b64) sha256=$(sha256sum /tmp/one.b64 | cut -d' ' -f1)"
          done
          cat .canonical-upload/portrait-01.b64 .canonical-upload/portrait-02.b64 .canonical-upload/portrait-03.b64 .canonical-upload/portrait-04.b64 .canonical-upload/portrait-05.b64 .canonical-upload/portrait-06.b64 | tr -d '\r\n\t ' > /tmp/prefix.b64
          echo "prefix chars=$(wc -c < /tmp/prefix.b64) sha256=$(sha256sum /tmp/prefix.b64 | cut -d' ' -f1)"
          echo 'EXPECTED chunks:'
          echo '01 a1c052d258e14573afdf94058bf5478ea0adf609404c0b449c65a62437f70bee'
          echo '02 e1fb6458bf8418a69d18d861f802afbb4825c2e255437c07ad8b5771dc8a8506'
          echo '03 801a8398a2e12fc38667b78ed0d93491d0b7ddf3998713b102bb8af57bf3a0a8'
          echo '04 038c54ca93629f873d5f43471a43903c4798562eda4399b222cb5e06ff31bffe'
          echo '05 8d1b32b987d4cb6cd223def5d8a63153d76d0ec5a21a36f93c037fee6e021483'
          echo '06 912b2cb7c93d5fefcf48a7fe4569e3960d5272b429715300a174ae3f59443840'
          echo 'EXPECTED prefix_107706=0f2bb9bd1b52c50212318cfef8ffda1ad7bece98bd7ff9c33c4f12031ac794e8'
          if [ -f .canonical-upload/portrait-tail.b64 ]; then
            tr -d '\r\n\t ' < .canonical-upload/portrait-tail.b64 > /tmp/tail.b64
            echo "tail chars=$(wc -c < /tmp/tail.b64) sha256=$(sha256sum /tmp/tail.b64 | cut -d' ' -f1)"
            echo 'EXPECTED tail_6666=3bc0987a73ea8afb665bf51bee69b1711d53252e30bfbc7de4c7b295ef6aca74'
          fi
