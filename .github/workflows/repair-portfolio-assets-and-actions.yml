name: Repair portfolio assets and actions

on:
  push:
    paths:
      - '.github/workflows/repair-portfolio-assets-and-actions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build verified clean assets
        shell: bash
        run: |
          set -euo pipefail
          cp assets/portrait.jpg assets/Dr_Adeelah_Qattan_Portrait_Original.jpg
          base64 -d .tmp/cert500.b64 > assets/King_Fahd_Medal_Certificate_Full_2019.jpg
          test "$(stat -c%s assets/Dr_Adeelah_Qattan_Portrait_Original.jpg)" -gt 100000
          test "$(stat -c%s assets/King_Fahd_Medal_Certificate_Full_2019.jpg)" -gt 50000

      - name: Patch mobile typography actions and asset references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          t = p.read_text(encoding='utf-8')

          old_nav = '.mobile-panel a{display:block;text-decoration:none;color:var(--teal-950);font:600 1.5rem/1.3 "Cormorant Garamond",serif;padding:13px 0;border-bottom:1px solid var(--line)}'
          new_nav = '.mobile-panel > a{display:block;text-decoration:none;color:var(--teal-950);font:600 .95rem/1.45 Outfit,sans-serif;padding:10px 0;border-bottom:1px solid var(--line)}html[lang="ar"] .mobile-panel > a{font-family:"Noto Kufi Arabic",sans-serif}'
          if old_nav in t:
              t = t.replace(old_nav, new_nav, 1)

          t = re.sub(r'assets/(?:portrait\.jpg|Dr_Adeelah_Qattan_Portrait_Original\.jpg)(?:\?v=[^"\']+)?',
                     'assets/Dr_Adeelah_Qattan_Portrait_Original.jpg?v=20260814-mobile-final', t)
          t = re.sub(r'assets/(?:King_Fahd_Medal_Third_Degree_2019|King_Fahd_Medal_Certificate_Full_2019)\.jpg(?:\?v=[^"\']+)?',
                     'assets/King_Fahd_Medal_Certificate_Full_2019.jpg?v=20260814-mobile-final', t)
          t = t.replace('download="Dr_Adeelah_Qattan_Portrait.jpg"', 'download="Dr_Adeelah_Qattan_Portrait_Original.jpg"')

          hs = t.index('<header class="hero"')
          he = t.index('</header>', hs)
          hero = t[hs:he]
          hero = re.sub(r'\s*<button class="btn btn-ghost"[^>]*onclick="window\.print\(\)"[^>]*>.*?</button>', '', hero, count=1, flags=re.S)
          t = t[:hs] + hero + t[he:]

          marker = '/* MOBILE-UX-REFINEMENT-FINAL */'
          css = '''
          /* MOBILE-UX-REFINEMENT-FINAL */
          @media(max-width:980px){
            .mobile-panel{padding:18px 22px 24px;overflow-y:auto}
            .mobile-panel > a{font-size:.92rem!important;line-height:1.4!important;padding:9px 0!important}
            .mobile-panel .sidebar-downloads{gap:7px;margin-top:14px;padding-bottom:22px}
            .mobile-panel .sidebar-downloads .resource-download{display:flex!important;width:100%;min-height:42px!important;height:auto!important;padding:8px 12px!important;border-radius:11px!important;font:600 .76rem/1.3 Outfit,sans-serif!important;border-bottom:0!important;white-space:normal;text-align:center;box-shadow:0 7px 16px rgba(15,61,68,.12)!important}
            html[lang="ar"] .mobile-panel .sidebar-downloads .resource-download{font-family:"Noto Kufi Arabic",sans-serif!important;font-size:.72rem!important}
            .mobile-panel .sidebar-downloads .action-icon{font-size:.86rem!important;line-height:1;flex:0 0 auto}
            .royal-document{max-width:390px;margin-left:auto;margin-right:auto;padding:8px}
            .royal-document img{display:block;width:100%;height:auto!important;object-fit:contain!important;max-height:none!important}
          }
          @media(max-width:650px){
            .mobile-panel{padding:16px 20px 20px}
            .mobile-panel > a{font-size:.88rem!important;padding:8px 0!important}
            .mobile-panel .sidebar-downloads{gap:6px;margin-top:12px}
            .mobile-panel .sidebar-downloads .resource-download{min-height:40px!important;padding:7px 11px!important;font-size:.72rem!important}
            html[lang="ar"] .mobile-panel .sidebar-downloads .resource-download{font-size:.69rem!important}
            .royal-document{max-width:350px;padding:7px}
            .royal-document figcaption{padding:8px 6px 3px}
            .royal-document figcaption strong{font-size:.64rem}
          }
          '''
          if marker not in t:
              t = t.replace('    @media(prefers-reduced-motion:reduce)', css + '    @media(prefers-reduced-motion:reduce)', 1)
          else:
              t = re.sub(r'/\* MOBILE-UX-REFINEMENT-FINAL \*/.*?(?=\s*@media\(prefers-reduced-motion:reduce\))', css.strip() + '\n    ', t, count=1, flags=re.S)

          p.write_text(t, encoding='utf-8')
          PY

      - name: Verify requested mobile state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          t = Path('index.html').read_text(encoding='utf-8')
          assert '.mobile-panel > a{' in t
          assert '.mobile-panel a{display:block;text-decoration:none;color:var(--teal-950);font:600 1.5rem' not in t
          assert 'font:600 .76rem/1.3 Outfit,sans-serif!important' in t
          assert 'assets/Dr_Adeelah_Qattan_Portrait_Original.jpg?v=20260814-mobile-final' in t
          assert 'assets/King_Fahd_Medal_Certificate_Full_2019.jpg?v=20260814-mobile-final' in t
          assert Path('assets/Dr_Adeelah_Qattan_Portrait_Original.jpg').stat().st_size > 100000
          assert Path('assets/King_Fahd_Medal_Certificate_Full_2019.jpg').stat().st_size > 50000

          hs = t.index('<header class="hero"')
          he = t.index('</header>', hs)
          assert 'window.print()' not in t[hs:he]

          ms = t.index('<div class="mobile-panel"')
          me = t.index('</div>\n\n  <header', ms)
          menu = t[ms:me]
          for token in ['🏅','🖼️','Download Personal Photo','تحميل الصورة الشخصية','📄','Download Speaker Bio','تحميل النبذة التعريفية','📘','Download CV','تحميل السيرة الذاتية','🖨️','window.print()']:
              assert token in menu, token

          rs = t.index('<section class="royal" id="royal">')
          re_ = t.index('</section>', rs)
          royal = t[rs:re_]
          assert '<a ' not in royal
          assert 'download' not in royal
          assert 'King_Fahd_Medal_Certificate_Full_2019.jpg' in royal
          print('PASS: compact mobile typography/buttons, standalone portrait download, full certificate display only, side print only')
          PY

      - name: Commit repaired portfolio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/Dr_Adeelah_Qattan_Portrait_Original.jpg assets/King_Fahd_Medal_Certificate_Full_2019.jpg
          git commit -m 'fix: refine mobile menu buttons portrait and medal certificate'
          git push origin HEAD:main
