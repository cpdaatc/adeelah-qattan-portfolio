name: Canonical portfolio finalization

on:
  push:
    paths:
      - '.github/workflows/canonical-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified historical originals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          # Last verified full-quality approved portrait.
          git show 4dc0083531bdba47efde2def754abf9f74228f78:assets/portrait.jpg > assets/Dr_Adeelah_Qattan_Portrait_High_Resolution.jpg
          cp assets/Dr_Adeelah_Qattan_Portrait_High_Resolution.jpg assets/portrait.jpg
          # Last verified complete uncropped King Fahd Medal certificate scan.
          git show 03b07633bdc8b68119ee021034511a0e985abbdb:assets/King_Fahd_Medal_Third_Degree_2019.jpg > assets/King_Fahd_Medal_Certificate_2019.jpg
          # Last CV revision explicitly finalizing conference leadership and CV updates.
          git show 42f4250d96f90fb941d84cc1d940642f2480c68e:assets/Dr_Adeelah_Qattan_CV_2026.pdf > assets/Dr_Adeelah_Qattan_CV_2026.pdf

      - name: Patch canonical UI and download actions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          version = 'canonical-20260814'
          portrait = f'assets/Dr_Adeelah_Qattan_Portrait_High_Resolution.jpg?v={version}'
          cert = f'assets/King_Fahd_Medal_Certificate_2019.jpg?v={version}'
          cv = f'assets/Dr_Adeelah_Qattan_CV_2026.pdf?v={version}'
          bio = f'assets/Dr_Adeelah_Qattan_Speaker_Bio_Bilingual.pdf?v={version}'

          # Hero portrait: correct source, while keeping the visual circular crop only on-screen.
          t, n = re.subn(
              r'(<div class="portrait-frame">\s*<img\s+src=")[^"]+("[^>]*>)',
              rf'\1{portrait}\2', t, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Hero portrait element not found exactly once')

          # Hero actions: one action only. Print remains only in the side menu.
          hero_actions = '''<div class="hero-actions">
          <a class="btn btn-primary" href="#royal"><span class="action-icon" aria-hidden="true">🏅</span><span class="en">View Royal Honour</span><span class="ar">عرض التكريم الملكي</span></a>
        </div>'''
          t, n = re.subn(r'<div class="hero-actions">.*?</div>', hero_actions, t, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Hero actions block not found exactly once')

          # Side menu: exactly five clear, functionally matched EN/AR actions.
          side_actions = f'''<div class="sidebar-downloads">
      <a class="btn btn-primary resource-download" href="#royal"><span class="action-icon" aria-hidden="true">🏅</span><span class="en">View Royal Honour</span><span class="ar">عرض التكريم الملكي</span></a>
      <a class="btn btn-primary resource-download" href="{portrait}" download="Dr_Adeelah_Qattan_Portrait_High_Resolution.jpg"><span class="action-icon" aria-hidden="true">🖼️</span><span class="en">Download Personal Photo</span><span class="ar">تحميل الصورة الشخصية</span></a>
      <a class="btn btn-primary resource-download" href="{bio}" download><span class="action-icon" aria-hidden="true">📄</span><span class="en">Download Speaker Bio (PDF)</span><span class="ar">تحميل النبذة التعريفية (PDF)</span></a>
      <a class="btn btn-primary resource-download" href="{cv}" download><span class="action-icon" aria-hidden="true">📘</span><span class="en">Download CV (PDF)</span><span class="ar">تحميل السيرة الذاتية (PDF)</span></a>
      <button class="btn btn-primary resource-download" type="button" onclick="window.print()"><span class="action-icon" aria-hidden="true">🖨️</span><span class="en">Print / Save CV</span><span class="ar">طباعة / حفظ السيرة</span></button>
    </div>'''
          t, n = re.subn(r'<div class="sidebar-downloads">.*?</div>', side_actions, t, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Sidebar actions block not found exactly once')

          # Royal certificate: complete document, display-only, never clickable/downloadable.
          royal_start = t.index('<section class="royal" id="royal">')
          royal_end = t.index('</section>', royal_start) + len('</section>')
          royal = t[royal_start:royal_end]
          figure = f'''<figure class="royal-document" aria-label="King Fahd Medal certificate 2019">
            <img src="{cert}" alt="King Fahd Medal — Third Degree certificate, 2019">
            <figcaption><strong class="en">King Fahd Medal — Third Degree · 2019</strong><strong class="ar">ميدالية الملك فهد — الدرجة الثالثة · 2019</strong></figcaption>
          </figure>'''
          royal2, n = re.subn(r'<figure class="royal-document".*?</figure>', figure, royal, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Royal certificate figure not found exactly once')
          if '<a ' in royal2 or 'download=' in royal2 or 'onclick=' in royal2:
              raise SystemExit('Royal certificate section still has interactive/download behavior')
          t = t[:royal_start] + royal2 + t[royal_end:]

          # Canonical mobile sizing and contrast. Override prior experimental CSS deterministically.
          canonical_css = '''
    /* CANONICAL-MOBILE-UI-20260814 */
    .sidebar-downloads .resource-download{background:var(--teal-950)!important;color:#fff!important;border:1px solid var(--teal-950)!important;font-family:Outfit,Arial,sans-serif!important;font-size:.78rem!important;font-weight:600!important;line-height:1.25!important;min-height:42px!important;height:auto!important;padding:9px 13px!important;border-radius:12px!important;box-shadow:0 7px 16px rgba(15,61,68,.11)!important;white-space:normal!important;text-align:center!important}
    html[lang="ar"] .sidebar-downloads .resource-download{font-family:"Noto Kufi Arabic",Tahoma,sans-serif!important;font-size:.72rem!important}
    .sidebar-downloads .action-icon{font-size:.9rem!important;line-height:1!important;flex:0 0 auto}
    .royal-document{width:min(430px,100%)!important;margin:0 auto!important;padding:9px!important;background:#fff!important;border:1px solid rgba(201,169,97,.55)!important;border-radius:20px!important;overflow:hidden!important}
    .royal-document img{display:block!important;width:100%!important;height:auto!important;max-height:none!important;object-fit:contain!important;object-position:center!important;border-radius:12px!important}
    .royal-document figcaption{padding:10px 7px 5px!important;text-align:center!important;color:var(--teal-950)!important}
    .royal-document figcaption strong{font-size:.72rem!important;line-height:1.35!important}
    @media(max-width:980px){
      .mobile-panel{padding:17px 20px 22px!important;overflow-y:auto!important}
      .mobile-panel > a{font-family:Outfit,Arial,sans-serif!important;font-size:.9rem!important;font-weight:600!important;line-height:1.35!important;padding:8px 0!important}
      html[lang="ar"] .mobile-panel > a{font-family:"Noto Kufi Arabic",Tahoma,sans-serif!important;font-size:.84rem!important}
      .mobile-panel .sidebar-downloads{gap:7px!important;margin-top:12px!important;padding-bottom:22px!important}
      .royal-document{width:min(340px,88vw)!important}
    }
    @media(max-width:650px){
      .mobile-panel{padding:15px 18px 20px!important}
      .mobile-panel > a{font-size:.84rem!important;padding:7px 0!important}
      html[lang="ar"] .mobile-panel > a{font-size:.78rem!important}
      .sidebar-downloads .resource-download{font-size:.72rem!important;min-height:40px!important;padding:8px 11px!important;border-radius:11px!important}
      html[lang="ar"] .sidebar-downloads .resource-download{font-size:.67rem!important}
      .royal-document{width:min(310px,86vw)!important;padding:7px!important}
    }
          '''
          if '/* CANONICAL-MOBILE-UI-20260814 */' in t:
              t = re.sub(r'/\* CANONICAL-MOBILE-UI-20260814 \*/.*?(?=</style>)', canonical_css.strip()+'\n  ', t, count=1, flags=re.S)
          else:
              t = t.replace('</style>', canonical_css + '\n  </style>', 1)

          p.write_text(t, encoding='utf-8')
          PY

      - name: Verify assets, content, roles, languages and actions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, struct

          def jpeg_size(path):
              data = Path(path).read_bytes()
              assert data[:2] == b'\xff\xd8' and data[-2:] == b'\xff\xd9', f'{path}: invalid JPEG markers'
              i = 2
              while i + 9 < len(data):
                  if data[i] != 0xFF:
                      i += 1; continue
                  marker = data[i+1]; i += 2
                  if marker in (0xD8,0xD9): continue
                  if i+2 > len(data): break
                  ln = int.from_bytes(data[i:i+2], 'big')
                  if marker in range(0xC0,0xC4):
                      h = int.from_bytes(data[i+3:i+5], 'big')
                      w = int.from_bytes(data[i+5:i+7], 'big')
                      return w,h
                  i += ln
              raise AssertionError(f'{path}: JPEG size not found')

          portrait = Path('assets/Dr_Adeelah_Qattan_Portrait_High_Resolution.jpg')
          cert = Path('assets/King_Fahd_Medal_Certificate_2019.jpg')
          cv = Path('assets/Dr_Adeelah_Qattan_CV_2026.pdf')
          assert portrait.stat().st_size > 50000
          assert cert.stat().st_size > 20000
          assert cv.stat().st_size > 50000
          pw, ph = jpeg_size(portrait)
          cw, ch = jpeg_size(cert)
          assert pw >= 500 and ph >= 500, (pw,ph)
          assert cw >= 500 and ch > cw, (cw,ch)

          t = Path('index.html').read_text(encoding='utf-8')
          assert 'Dr_Adeelah_Qattan_Portrait_High_Resolution.jpg?v=canonical-20260814' in t
          assert 'King_Fahd_Medal_Certificate_2019.jpg?v=canonical-20260814' in t
          assert 'Dr_Adeelah_Qattan_CV_2026.pdf?v=canonical-20260814' in t

          hs = t.index('<header class="hero"')
          he = t.index('</header>', hs)
          hero = t[hs:he]
          assert hero.count('View Royal Honour') == 1
          assert 'window.print()' not in hero
          assert 'Print / Save CV' not in hero

          ms = t.index('<div class="mobile-panel"')
          me = t.index('</div>\n\n  <header', ms)
          menu = t[ms:me]
          for token in ['🏅','View Royal Honour','عرض التكريم الملكي','🖼️','Download Personal Photo','تحميل الصورة الشخصية','📄','Download Speaker Bio (PDF)','تحميل النبذة التعريفية (PDF)','📘','Download CV (PDF)','تحميل السيرة الذاتية (PDF)','🖨️','Print / Save CV','طباعة / حفظ السيرة']:
              assert token in menu, token
          assert menu.count('resource-download') == 5

          rs = t.index('<section class="royal" id="royal">')
          re_ = t.index('</section>', rs)
          royal = t[rs:re_]
          assert '<a ' not in royal and 'download=' not in royal and 'onclick=' not in royal

          # Current role wording and both emails.
          for token in [
              'Academic Affairs &amp; Training',
              'الشؤون الأكاديمية والتدريب',
              'Medical Education &amp; Training Department',
              'إدارة التعليم الطبي والتدريب',
              'atqattan@hotmail.com',
              'adeelahqattan@gmail.com',
              'Mumaris+', 'ممارس+'
          ]: assert token in t, token

          # Conference leadership 2023–2026.
          for token in [
              '2nd Medical Education Conference','Healthcare Artificial Intelligence',
              '3rd Medical Education Conference','Innovation in Medical Education',
              '4th Medical Education Conference','AI and Medical Education: Partnership for Resilient Healthcare',
              '5th Medical Education Leadership Summit','From Innovation to Measurable Impact and Sustainable System',
              'From AI to Responsible Intelligence','Conference Committee Chair','رئيسة لجنة المؤتمر'
          ]: assert token in t, token

          # User-specified committee portfolio.
          committee_tokens = [
              'Scholarship', 'Human Resources', 'Advisory', 'Postgraduate',
              'Continuing Professional Development', 'Weekly', 'Train-the-Trainer',
              'Leadership Team', 'Research', 'Ethics'
          ]
          for token in committee_tokens: assert token in t, token

          # Language isolation guardrails.
          for token in ['html[lang="en"] .ar{display:none!important}','html[lang="ar"] .en{display:none!important}']:
              assert token in t, token

          print('PASS')
          print('portrait', portrait.stat().st_size, jpeg_size(portrait))
          print('certificate', cert.stat().st_size, jpeg_size(cert))
          print('cv', cv.stat().st_size)
          print('side_actions', menu.count('resource-download'))
          PY

      - name: Remove regression sources and temporary staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp .canonical-upload
          rm -f assets/README_IMAGE_FIX.txt assets/CANONICAL_ASSETS.md
          find .github/workflows -maxdepth 1 -type f -name '*.yml' ! -name 'canonical-finalize.yml' -delete
          rm -f .github/workflows/canonical-finalize.yml

      - name: Commit canonical portfolio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: establish canonical portfolio assets and remove regressions'
          git push origin HEAD:main
