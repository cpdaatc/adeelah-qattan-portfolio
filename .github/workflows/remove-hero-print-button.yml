name: Remove hero print button

on:
  push:
    paths:
      - '.github/workflows/remove-hero-print-button.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove hero print/save button only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          target='''          <button class="btn btn-ghost" onclick="window.print()"><span class="en">Print / Save CV</span><span class="ar">طباعة / حفظ السيرة</span></button>\n'''
          if target not in t:
              raise SystemExit('Hero print button not found')
          t=t.replace(target,'',1)
          p.write_text(t,encoding='utf-8')
          PY
      - name: Verify sidebar print button remains
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          assert 'Print / Save CV</span>' not in t
          assert 'Print / Save CV as PDF' in t
          assert 'طباعة / حفظ السيرة PDF' in t
          print('Hero button removed; sidebar button retained')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: remove hero print save button'
          git push origin HEAD:main