name: Update portfolio from supplied evidence

on:
  push:
    paths:
      - '.github/workflows/update-portfolio-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add evidence-based portfolio content
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Navigation: add one high-value section, desktop + mobile.
          desktop_anchor = '''        <a href="#governance"><span class="en">Governance</span><span class="ar">الحوكمة</span></a>'''
          desktop_insert = desktop_anchor + '''\n        <a href="#innovation"><span class="en">Quality & Research</span><span class="ar">الجودة والبحث</span></a>'''
          if '#innovation' not in text.split('</nav>', 1)[0]:
              text = text.replace(desktop_anchor, desktop_insert, 1)

          mobile_anchor = '''    <a href="#governance"><span class="en">Governance</span><span class="ar">الحوكمة واللجان</span></a>'''
          mobile_insert = mobile_anchor + '''\n    <a href="#innovation"><span class="en">Quality & Research</span><span class="ar">الجودة والبحث</span></a>'''
          if mobile_insert not in text:
              text = text.replace(mobile_anchor, mobile_insert, 1)

          # Styling for the new content. No supplied screenshots are embedded.
          css_marker = '    .references-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}'
          innovation_css = '''    .innovation-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.innovation-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;position:relative;overflow:hidden;transition:.3s var(--ease)}.innovation-card:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(180deg,var(--teal-600),var(--gold))}.innovation-card:hover{transform:translateY(-4px);box-shadow:0 18px 45px rgba(15,61,68,.09);border-color:#AFCBCD}.project-meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.project-meta span{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-800);background:var(--teal-50);border:1px solid #D4E7E9;border-radius:999px;padding:5px 8px}.innovation-card h3{margin:0 0 10px;color:var(--teal-950);font:600 1.38rem/1.15 "Cormorant Garamond",serif}.innovation-card p{margin:0;color:#536269;font-size:.86rem}.innovation-card .status{margin-top:17px;padding-top:14px;border-top:1px solid var(--line);color:#405158;font-size:.78rem}.innovation-card .status b{color:var(--gold-deep)}.research-note{margin:24px 0 0;padding:16px 18px;border-radius:16px;background:#F6FAFA;border:1px solid var(--line);font-size:.8rem;color:#596970}.conference-wrap{margin-top:48px}.conference-title{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.conference-title h3{margin:0;color:var(--teal-950);font:600 1.7rem "Cormorant Garamond",serif}.conference-title p{margin:0;max-width:540px;color:var(--muted);font-size:.82rem}.conference-track{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.conference-item{background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px;min-height:190px;position:relative}.conference-item .year{display:inline-block;color:var(--gold-deep);font:600 1.25rem "Cormorant Garamond",serif;margin-bottom:12px}.conference-item h4{margin:0 0 8px;color:var(--teal-950);font-size:.92rem;line-height:1.35}.conference-item p{margin:0;color:#64737A;font-size:.77rem;line-height:1.55}.conference-item.planned{border-style:dashed;background:linear-gradient(145deg,#FCFDFD,#F3F9FA)}.conference-item.planned:after{content:"PLANNED";position:absolute;top:14px;right:14px;color:var(--teal-600);font-size:.56rem;font-weight:700;letter-spacing:.12em}html[lang="ar"] .conference-item.planned:after{content:"مخطط";right:auto;left:14px}.quality-recognition{margin-top:22px;display:flex;gap:14px;align-items:flex-start;padding:19px 20px;border:1px solid rgba(201,169,97,.42);border-radius:17px;background:linear-gradient(135deg,#FFFEFA,#FBF7EC)}.quality-recognition .badge{width:38px;height:38px;flex:0 0 38px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#fff;font-weight:700}.quality-recognition strong{display:block;color:var(--teal-950);font-size:.88rem}.quality-recognition span{color:#6A6354;font-size:.77rem}.\n    @media(max-width:980px){.innovation-grid{grid-template-columns:1fr 1fr}.conference-track{grid-template-columns:1fr 1fr}}@media(max-width:650px){.innovation-grid,.conference-track{grid-template-columns:1fr}.conference-title{display:block}.conference-title p{margin-top:7px}.innovation-card{padding:22px}}\n'''
          if '.innovation-grid{' not in text:
              text = text.replace(css_marker, innovation_css + css_marker, 1)

          # Evidence-based section inserted after Governance and before Credentials.
          innovation_section = '''\n  <section class="section section-soft" id="innovation">\n    <div class="container">\n      <div class="section-head reveal"><div><small>04 / Quality &amp; Research</small><h2><span class="en">Quality, Research &amp; <em>Academic Innovation</em></span><span class="ar">الجودة والبحث و<em>الابتكار الأكاديمي</em></span></h2></div><p class="en">Selected initiatives documented in the supplied quality and conference materials. Ongoing research is presented as ongoing and is not described as published work.</p><p class="ar">مبادرات مختارة موثقة في مواد الجودة والمؤتمرات المرفوعة. ويُعرض البحث الجاري بصفته قيد العمل دون وصفه كبحث منشور.</p></div>\n\n      <div class="innovation-grid reveal">\n        <article class="innovation-card">\n          <div class="project-meta"><span>2025</span><span>QIP 778</span><span>Level 2</span></div>\n          <h3><span class="en">Academic Sustainability in Trainer Qualification (TOT)</span><span class="ar">الاستدامة الأكاديمية في تأهيل المدربين (TOT)</span></h3>\n          <p class="en">Empowering Academic Excellence Through Sustainable TOT Accreditation. The supplied project table identifies Dr. Adeelah Talat Qattan as Team Leader.</p>\n          <p class="ar">تعزيز التميز الأكاديمي من خلال استدامة اعتماد تدريب المدربين، ويُظهر جدول المشروع المرفوع د. عديلة طلعت قطان كقائد للفريق.</p>\n          <div class="status"><b><span class="en">Research status:</span><span class="ar">حالة البحث:</span></b> <span class="en">Research work/manuscript associated with BioMed Central (BMC), REC 899, as documented in the supplied material.</span><span class="ar">عمل/نشرة بحثية مرتبطة بـ BioMed Central (BMC) بالرقم REC 899 وفق المادة المرفوعة.</span></div>\n        </article>\n\n        <article class="innovation-card">\n          <div class="project-meta"><span>2024</span><span>QIP 328</span><span>Level 2</span></div>\n          <h3><span class="en">Enhancing Life Support Training &amp; Staff Competency</span><span class="ar">تعزيز تدريب دعم الحياة وكفاءة الكوادر الصحية</span></h3>\n          <p class="en">Implementing Innovative Strategies to Enhance Life Support Training and Improve Healthcare Staff Competency. The supplied project table identifies Dr. Adeelah Qattan as Team Leader.</p>\n          <p class="ar">تطبيق استراتيجيات مبتكرة لتعزيز تدريب دعم الحياة وتحسين كفاءة الكوادر الصحية، ويُظهر جدول المشروع د. عديلة قطان كقائد للفريق.</p>\n          <div class="status"><b><span class="en">Research status:</span><span class="ar">حالة البحث:</span></b> <span class="en">Research manuscript is in progress; the supplied material states expected publication by the end of 2026.</span><span class="ar">العمل على النشرة البحثية جارٍ، وتشير المادة المرفوعة إلى توقع النشر بنهاية عام 2026.</span></div>\n        </article>\n\n        <article class="innovation-card">\n          <div class="project-meta"><span><span class="en">Ongoing</span><span class="ar">قيد العمل</span></span><span>ED</span><span>KFAFH</span></div>\n          <h3><span class="en">Enhancing Patient Trust in ED Interactions</span><span class="ar">تعزيز ثقة المرضى في تفاعلات قسم الطوارئ</span></h3>\n          <p class="en">“Empowering Tomorrow’s Physicians Today: Enhancing Patient Trust in Emergency Department (ED) Interactions” — a trainee-led initiative at KFAFH.</p>\n          <p class="ar">«تمكين أطباء الغد اليوم: تعزيز ثقة المرضى في تفاعلات قسم الطوارئ» — مبادرة يقودها المتدربون في مستشفى الملك فهد للقوات المسلحة.</p>\n          <div class="status"><b><span class="en">Research status:</span><span class="ar">حالة البحث:</span></b> <span class="en">Research manuscript in progress, as stated in the supplied material.</span><span class="ar">جارٍ العمل على نشرة بحثية وفق المادة المرفوعة.</span></div>\n        </article>\n      </div>\n\n      <div class="quality-recognition reveal">\n        <div class="badge">★</div>\n        <div><strong><span class="en">2025 — Saudi Quality Council Certificate of Appreciation</span><span class="ar">2025 — شهادة شكر وتقدير من المجلس السعودي للجودة</span></strong><span class="en">Second cycle of the Scientific Research Award in Quality &amp; Institutional Excellence, as shown in the supplied documentation.</span><span class="ar">الدورة الثانية لجائزة البحث العلمي في الجودة والتميز المؤسسي، وفق التوثيق المرفوع.</span></div>\n      </div>\n\n      <div class="research-note reveal"><span class="en"><strong>Evidence rule:</strong> QIP numbers, project titles, team-leader attribution and research status above are limited to what is visible in the supplied materials; no publication or award-win claim has been inferred.</span><span class="ar"><strong>ضبط التوثيق:</strong> أرقام QIP ومسميات المشاريع ونسبة قيادة الفريق وحالة البحث أعلاه مقيدة بما يظهر في المواد المرفوعة، ولم تتم إضافة ادعاء بالنشر أو الفوز بجائزة دون توثيق.</span></div>\n\n      <div class="conference-wrap reveal">\n        <div class="conference-title"><h3><span class="en">Medical Education Conference Series</span><span class="ar">سلسلة مؤتمرات التعليم الطبي</span></h3><p class="en">Conference themes documented in the supplied Academic Affairs material. The 2026 item is explicitly shown as a future/planned direction.</p><p class="ar">موضوعات المؤتمرات كما تظهر في مادة الشؤون الأكاديمية المرفوعة، مع عرض 2026 بوضوح كتوجه مستقبلي/مخطط.</p></div>\n        <div class="conference-track">\n          <div class="conference-item"><div class="year">2023 · 2nd</div><h4><span class="en">Medical Education Conference</span><span class="ar">مؤتمر التعليم الطبي الثاني</span></h4><p><span class="en">Healthcare Artificial Intelligence</span><span class="ar">الذكاء الاصطناعي في الرعاية الصحية</span></p></div>\n          <div class="conference-item"><div class="year">2024 · 3rd</div><h4><span class="en">Medical Education Conference</span><span class="ar">مؤتمر التعليم الطبي الثالث</span></h4><p><span class="en">Innovation in Medical Education</span><span class="ar">الابتكار في التعليم الطبي</span></p></div>\n          <div class="conference-item"><div class="year">2025 · 4th</div><h4><span class="en">Medical Education Conference</span><span class="ar">مؤتمر التعليم الطبي الرابع</span></h4><p><span class="en">AI and Medical Education: Partnership for Resilient Healthcare</span><span class="ar">الذكاء الاصطناعي والتعليم الطبي: شراكة لرعاية صحية مرنة</span></p></div>\n          <div class="conference-item planned"><div class="year">2026 · 5th</div><h4><span class="en">Medical Education Leadership Summit</span><span class="ar">قمة قيادة التعليم الطبي</span></h4><p><span class="en">From Innovation to Measurable Impact and Sustainable System · From AI to Responsible Intelligence</span><span class="ar">من الابتكار إلى أثر قابل للقياس ونظام مستدام · من الذكاء الاصطناعي إلى الذكاء المسؤول</span></p></div>\n        </div>\n      </div>\n    </div>\n  </section>\n\n'''
          credential_marker = '  <section class="section section-soft" id="credentials">'
          if 'id="innovation"' not in text:
              text = text.replace(credential_marker, innovation_section + credential_marker, 1)

          # Renumber following sections after insertion.
          text = text.replace('<small>04 / Credentials</small>', '<small>05 / Credentials</small>')
          text = text.replace('<small>05 / Recognition</small>', '<small>06 / Recognition</small>')
          text = text.replace('<small>06 / Activities</small>', '<small>07 / Activities</small>')
          text = text.replace('<small>07 / References</small>', '<small>08 / References</small>')

          # Add documented 2025 recognition without implying a win.
          recognition_marker = '      <div class="recognition-list reveal">\n        <div class="recognition"><time>2024</time>'
          recognition_2025 = '''      <div class="recognition-list reveal">\n        <div class="recognition"><time>2025</time><div><h3><span class="en">Saudi Quality Council — Certificate of Appreciation</span><span class="ar">المجلس السعودي للجودة — شهادة شكر وتقدير</span></h3><p><span class="en">Second cycle of the Scientific Research Award in Quality &amp; Institutional Excellence</span><span class="ar">الدورة الثانية لجائزة البحث العلمي في الجودة والتميز المؤسسي</span></p></div></div>\n        <div class="recognition"><time>2024</time>'''
          if 'Saudi Quality Council — Certificate of Appreciation' not in text:
              text = text.replace(recognition_marker, recognition_2025, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify evidence, language isolation and mobile-ready structure
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              'id="innovation"', 'QIP 778', 'QIP 328', 'REC 899',
              'Enhancing Patient Trust in ED Interactions',
              'Saudi Quality Council — Certificate of Appreciation',
              '2026 · 5th', 'Medical Education Leadership Summit',
              'From AI to Responsible Intelligence'
          ]
          for item in required:
              assert item in text, item
          assert 'portfolio-evidence-' not in text
          assert 'quality-projects-documentation.jpg' not in text
          assert '<small>05 / Credentials</small>' in text
          assert '<small>08 / References</small>' in text
          assert 'html[lang="ar"] .en{display:none!important}' in text
          print('portfolio evidence update verified')
          PY

      - name: Commit portfolio update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'feat: add quality research and conference evidence to portfolio'
            git push origin HEAD:main
          fi