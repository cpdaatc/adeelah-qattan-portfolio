name: Fix CV portrait

on:
  push:
    branches: [fix-cv-portrait-20260815]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF/image verification tools
        run: python3 -m pip install --user --break-system-packages --quiet pymupdf pillow numpy

      - name: Repair only the gray CV portrait placeholder
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import io, shutil
          import fitz
          import numpy as np
          from PIL import Image, ImageOps, ImageDraw

          pdf_path = Path('assets/Dr_Adeelah_Qattan_CV_2026.pdf')
          portrait_path = Path('assets/Dr_Adeelah_Qattan_Portrait_20260815.PNG')
          assert pdf_path.exists(), pdf_path
          assert portrait_path.exists(), portrait_path

          doc = fitz.open(pdf_path)
          original_pages = len(doc)
          assert original_pages >= 2, f'unexpected CV page count: {original_pages}'
          page = doc[0]
          pr = page.rect

          candidates = []
          for d in page.get_drawings():
              r = d.get('rect')
              fill = d.get('fill')
              if not r or fill is None:
                  continue
              w, h = r.width, r.height
              if 45 <= w <= 120 and 45 <= h <= 120 and abs(w-h) <= 12 and r.x0 > pr.width * 0.62 and r.y0 < 190:
                  candidates.append((w*h, r, fill, d.get('color'), d.get('width')))
          print('CANDIDATES', [(tuple(round(v,1) for v in r), fill, stroke, sw) for _,r,fill,stroke,sw in candidates])
          assert candidates, 'could not locate top-right portrait placeholder; refusing blind PDF edit'
          candidates.sort(reverse=True, key=lambda x: x[0])
          _, box, fill, stroke, stroke_width = candidates[0]
          print('PLACEHOLDER', tuple(round(v,2) for v in box), 'fill=', fill, 'stroke=', stroke, 'width=', stroke_width)

          mat = fitz.Matrix(2, 2)
          before_pix = page.get_pixmap(matrix=mat, alpha=False)
          before = np.frombuffer(before_pix.samples, dtype=np.uint8).reshape(before_pix.height, before_pix.width, before_pix.n)

          src = Image.open(portrait_path).convert('RGB')
          size = 1200
          face = ImageOps.fit(src, (size, size), method=Image.Resampling.LANCZOS, centering=(0.5, 0.45))
          mask = Image.new('L', (size, size), 0)
          ImageDraw.Draw(mask).ellipse((5,5,size-5,size-5), fill=255)
          rgba = face.convert('RGBA')
          rgba.putalpha(mask)
          buf = io.BytesIO()
          rgba.save(buf, format='PNG', optimize=True)

          inset = max(1.2, float(stroke_width or 1.0) + 0.4)
          target = fitz.Rect(box.x0+inset, box.y0+inset, box.x1-inset, box.y1-inset)
          page.insert_image(target, stream=buf.getvalue(), keep_proportion=True, overlay=True)

          tmp = pdf_path.with_name(pdf_path.stem + '_fixed.pdf')
          doc.save(tmp, garbage=4, deflate=True, clean=True)
          doc.close()

          fixed = fitz.open(tmp)
          assert len(fixed) == original_pages, f'page count changed: {original_pages} -> {len(fixed)}'
          after_pix = fixed[0].get_pixmap(matrix=mat, alpha=False)
          after = np.frombuffer(after_pix.samples, dtype=np.uint8).reshape(after_pix.height, after_pix.width, after_pix.n)
          fixed.close()

          x0,y0,x1,y1 = [int(v*2) for v in (target.x0,target.y0,target.x1,target.y1)]
          crop = after[y0:y1, x0:x1, :3]
          variance = float(crop.var())
          unique = len(np.unique(crop.reshape(-1,3), axis=0))
          print('PORTRAIT_VARIANCE', variance, 'UNIQUE_RGB', unique)
          assert variance > 250 and unique > 500, 'portrait region still looks like a flat placeholder'

          diff = np.abs(after[:,:,:3].astype(np.int16) - before[:,:,:3].astype(np.int16))
          mask_out = np.ones(diff.shape[:2], dtype=bool)
          pad = 10
          mask_out[max(0,y0-pad):min(mask_out.shape[0],y1+pad), max(0,x0-pad):min(mask_out.shape[1],x1+pad)] = False
          outside_mean = float(diff[mask_out].mean())
          outside_p99 = float(np.percentile(diff[mask_out], 99))
          print('OUTSIDE_MEAN_DIFF', outside_mean, 'OUTSIDE_P99', outside_p99)
          assert outside_mean < 0.8, f'unexpected changes outside portrait: {outside_mean}'

          shutil.move(tmp, pdf_path)
          print('PASS: portrait embedded; page count and all non-portrait content preserved')
          PY

      - name: Bust cached CV download URL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='assets/Dr_Adeelah_Qattan_CV_2026.pdf?v=20260814-10'
          new='assets/Dr_Adeelah_Qattan_CV_2026.pdf?v=20260815-cv-photo'
          assert old in s, 'old CV cache key not found'
          p.write_text(s.replace(old,new), encoding='utf-8')
          PY

      - name: Restore temporary workflows and commit verified production fix
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/capture-final-mobile-screens.yml
          rm -f .github/workflows/fix-cv-portrait.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: replace CV portrait placeholder with verified photo'
          git push origin HEAD:fix-cv-portrait-20260815
