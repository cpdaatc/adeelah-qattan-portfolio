# Restore the full-quality approved portrait directly from repository history
name: Fix portfolio language isolation and portrait

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-language-and-portrait.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore full-quality portrait from Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p assets
          EXPECTED_BLOB='732e308023ed5b5e63c4a61683bfe643fcad35b4'
          gh api repos/${{ github.repository }}/git/blobs/$EXPECTED_BLOB --jq '.content' | tr -d '\n' | base64 -d > assets/portrait.jpg
          test -s assets/portrait.jpg
          file assets/portrait.jpg
          test "$(stat -c%s assets/portrait.jpg)" = '147734'
          ACTUAL_BLOB=$(git hash-object assets/portrait.jpg)
          echo "portrait git blob: $ACTUAL_BLOB"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"

      - name: Verify portfolio safeguards
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          required = [
              'html[lang="en"] .ar{display:none!important}',
              'html[lang="ar"] .en{display:none!important}',
              'src="assets/portrait.jpg"'
          ]
          missing = [item for item in required if item not in s]
          if missing:
              raise SystemExit('Missing required portfolio safeguards: ' + ', '.join(missing))
          PY

      - name: Commit verified full-quality portrait
        run: |
          if git diff --quiet -- assets/portrait.jpg; then
            echo "Portrait already matches the full-quality historical asset"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portrait.jpg
          git commit -m "fix: restore full-quality approved portrait"
          git push
