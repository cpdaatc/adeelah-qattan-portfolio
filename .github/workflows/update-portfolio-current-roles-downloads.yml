          "$BROWSER" --headless --no-sandbox --disable-gpu --allow-file-access-from-files --no-pdf-header-footer --print-to-pdf="$PWD/assets/Dr_Adeelah_Qattan_CV_2026.pdf" "file://$PWD/cv-download.html"
          "$BROWSER" --headless --no-sandbox --disable-gpu --allow-file-access-from-files --no-pdf-header-footer --print-to-pdf="$PWD/assets/Dr_Adeelah_Qattan_Speaker_Bio_Bilingual.pdf" "file://$PWD/speaker-bio.html"
