name: Apply medal closeup

on:
  push:
    paths:
      - '.github/workflows/apply-medal-closeup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore clear medal closeup
        run: |
          cat .tmp/medal-1.b64 .tmp/medal-2.b64 | base64 -d > assets/King_Fahd_Medal_Closeup_2019.jpg
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          t=t.replace('assets/King_Fahd_Medal_Third_Degree_2019.jpg?v=20260814-2', 'assets/King_Fahd_Medal_Closeup_2019.jpg?v=20260814-3')
          t=t.replace('assets/King_Fahd_Medal_Third_Degree_2019.jpg', 'assets/King_Fahd_Medal_Closeup_2019.jpg?v=20260814-3')
          t=t.replace('.royal-document img{display:block;width:100%;height:auto;border-radius:11px}', '.royal-document img{display:block;width:100%;height:auto;aspect-ratio:520/458;object-fit:cover;border-radius:11px;background:#fff}')
          p.write_text(t,encoding='utf-8')
          PY
      - name: Verify image and page
        run: |
          test "$(head -c 2 assets/King_Fahd_Medal_Closeup_2019.jpg | xxd -p)" = "ffd8"
          test $(wc -c < assets/King_Fahd_Medal_Closeup_2019.jpg) -gt 30000
          grep -q 'King_Fahd_Medal_Closeup_2019.jpg' index.html
          grep -q 'ميدالية الملك فهد — الدرجة الثالثة · 2019' index.html
          echo 'clear medal image verified'
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/King_Fahd_Medal_Closeup_2019.jpg
          git commit -m 'fix: show clear King Fahd Medal closeup'
          git push origin HEAD:main
