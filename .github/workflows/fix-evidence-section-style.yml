name: Polish evidence section styling

on:
  push:
    paths:
      - '.github/workflows/fix-evidence-section-style.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix CSS and section rhythm
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          t=t.replace('.quality-recognition span{color:#6A6354;font-size:.77rem}.\n    @media', '.quality-recognition span{color:#6A6354;font-size:.77rem}\n    @media')
          t=t.replace('<div class="project-meta"><span><span class="en">Ongoing</span><span class="ar">قيد العمل</span></span><span>ED</span><span>KFAFH</span></div>', '<div class="project-meta"><span class="en">Ongoing</span><span class="ar">قيد العمل</span><span>ED</span><span>KFAFH</span></div>')
          t=t.replace('<section class="section section-soft" id="credentials">', '<section class="section" id="credentials">')
          t=t.replace('<section class="section" id="recognition">', '<section class="section section-soft" id="recognition">')
          t=t.replace('<section class="section section-soft" id="activities">', '<section class="section" id="activities">')
          t=t.replace('<section class="section" id="references">', '<section class="section section-soft" id="references">')
          p.write_text(t,encoding='utf-8')
          PY
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          assert '.quality-recognition span{color:#6A6354;font-size:.77rem}.\n' not in t
          assert '<section class="section section-soft" id="innovation">' in t
          assert '<section class="section" id="credentials">' in t
          assert '<section class="section section-soft" id="recognition">' in t
          assert '<div class="project-meta"><span class="en">Ongoing</span><span class="ar">قيد العمل</span><span>ED</span><span>KFAFH</span></div>' in t
          print('style polish verified')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: polish quality research section styling'
          git push origin HEAD:main