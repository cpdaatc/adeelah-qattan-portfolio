name: Apply final portfolio v2

on:
  push:
    paths:
      - '.github/workflows/apply-final-portfolio-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build verified medal image
        run: |
          cat .tmp/medal-new-*.b64 | base64 -d > assets/King_Fahd_Medal_Closeup_2019.jpg
          test "$(head -c 2 assets/King_Fahd_Medal_Closeup_2019.jpg | xxd -p)" = "ffd8"
          test "$(tail -c 2 assets/King_Fahd_Medal_Closeup_2019.jpg | xxd -p)" = "ffd9"
          test "$(wc -c < assets/King_Fahd_Medal_Closeup_2019.jpg)" -eq 20846
          file assets/King_Fahd_Medal_Closeup_2019.jpg | grep -q 'JPEG image data'

      - name: Update portfolio content
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')

          # Medal: clear close-up image only. No unrelated certificate content is mixed here.
          for old in [
              'assets/King_Fahd_Medal_Third_Degree_2019.jpg?v=20260814-2',
              'assets/King_Fahd_Medal_Third_Degree_2019.jpg',
              'assets/King_Fahd_Medal_Closeup_2019.jpg?v=20260814-3',
              'assets/King_Fahd_Medal_Closeup_2019.jpg?v=20260814-4'
          ]:
              t=t.replace(old,'assets/King_Fahd_Medal_Closeup_2019.jpg?v=20260814-5')

          old_img='<img src="assets/King_Fahd_Medal_Closeup_2019.jpg?v=20260814-5" alt="King Fahd Medal — Third Degree, 2019 documentation">'
          new_img='<a class="medal-zoom" href="assets/King_Fahd_Medal_Closeup_2019.jpg?v=20260814-5" target="_blank" rel="noopener" aria-label="Open King Fahd Medal image at full size"><img src="assets/King_Fahd_Medal_Closeup_2019.jpg?v=20260814-5" alt="King Fahd Medal — Third Degree, 2019"></a>'
          if old_img in t:
              t=t.replace(old_img,new_img,1)
          elif 'class="medal-zoom"' not in t:
              raise SystemExit('Royal medal image target not found')

          if '.royal-document a{display:block}' not in t:
              t=t.replace('.royal-document img{display:block;width:100%;height:auto;border-radius:11px}', '.royal-document a{display:block}.royal-document img{display:block;width:100%;height:auto;object-fit:contain;border-radius:11px;background:#fff;cursor:zoom-in}')

          # Unified, clearly actionable download buttons.
          import re
          t=re.sub(r'<a class="btn btn-primary resource-download" href="assets/Dr_Adeelah_Qattan_CV_2026\.pdf(?:\?[^\"]*)?" download>.*?</a>',
                   '<a class="btn btn-primary resource-download" href="assets/Dr_Adeelah_Qattan_CV_2026.pdf?v=20260814-5" download><span class="action-icon" aria-hidden="true">📄</span><span class="en">Download CV (PDF)</span><span class="ar">تحميل السيرة الذاتية (PDF)</span></a>',t,count=1)
          t=re.sub(r'<a class="btn btn-(?:ghost|primary) resource-download" href="assets/Dr_Adeelah_Qattan_Portrait_High_Resolution\.jpg(?:\?[^\"]*)?" download>.*?</a>',
                   '<a class="btn btn-primary resource-download" href="assets/Dr_Adeelah_Qattan_Portrait_High_Resolution.jpg?v=20260814-5" download><span class="action-icon" aria-hidden="true">📷</span><span class="en">Download Personal Photo</span><span class="ar">تحميل الصورة الشخصية</span></a>',t,count=1)
          t=re.sub(r'<a class="btn btn-(?:ghost|primary) resource-download" href="assets/Dr_Adeelah_Qattan_Speaker_Bio_Bilingual\.pdf(?:\?[^\"]*)?" download>.*?</a>',
                   '<a class="btn btn-primary resource-download" href="assets/Dr_Adeelah_Qattan_Speaker_Bio_Bilingual.pdf?v=20260814-5" download><span class="action-icon" aria-hidden="true">📝</span><span class="en">Download Speaker Bio (PDF)</span><span class="ar">تحميل النبذة التعريفية (PDF)</span></a>',t,count=1)
          if '.sidebar-downloads .resource-download{background:' not in t:
              t=t.replace('.sidebar-downloads{display:grid;gap:10px;margin-top:22px}', '.sidebar-downloads{display:grid;gap:10px;margin-top:22px}.sidebar-downloads .resource-download{background:var(--teal-950)!important;color:#fff!important;border-color:var(--teal-950)!important;justify-content:center;gap:10px}.sidebar-downloads .resource-download:hover{background:var(--teal-800)!important;border-color:var(--teal-800)!important;transform:translateY(-1px)}.sidebar-downloads .action-icon{font-size:1.05rem;line-height:1}')

          # Conference leadership intro.
          old_intro='<div class="conference-title"><h3><span class="en">Medical Education Conference Series</span><span class="ar">سلسلة مؤتمرات التعليم الطبي</span></h3><p class="en">Conference themes documented in the supplied Academic Affairs material. The 2026 item is explicitly shown as a future/planned direction.</p><p class="ar">موضوعات المؤتمرات كما تظهر في مادة الشؤون الأكاديمية المرفوعة، مع عرض 2026 بوضوح كتوجه مستقبلي/مخطط.</p></div>'
          new_intro='<div class="conference-title"><h3><span class="en">Medical Education Conference Leadership · 2023–2026</span><span class="ar">سجل قيادة وتنظيم المؤتمرات · 2023–2026</span></h3><p class="en">Dr. Adeelah Talat Qattan served as Conference Committee Chair across the annual Medical Education Conference series and the 5th Medical Education Leadership Summit.</p><p class="ar">تولت د. عديلة طلعت قطان رئاسة لجنة المؤتمر ضمن سلسلة مؤتمرات التعليم الطبي السنوية وقمة قيادات التعليم الطبي الخامسة.</p></div>'
          if old_intro in t:
              t=t.replace(old_intro,new_intro,1)

          cards=[
          ('<div class="conference-item"><div class="year"><span class="en">2023 · 2nd</span><span class="ar">2023 · الثاني</span></div><h4><span class="en">Medical Education Conference</span><span class="ar">مؤتمر التعليم الطبي الثاني</span></h4><p><span class="en">Healthcare Artificial Intelligence</span><span class="ar">الذكاء الاصطناعي في الرعاية الصحية</span></p></div>',
           '<div class="conference-item"><div class="year"><span class="en">2023 · 2nd</span><span class="ar">2023 · الثاني</span></div><h4><span class="en">2nd Medical Education Conference</span><span class="ar">المؤتمر السنوي الثاني للتعليم الطبي</span></h4><p class="conference-role"><span class="en">Conference Committee Chair</span><span class="ar">رئيسة لجنة المؤتمر</span></p><p><span class="en">Theme: Healthcare Artificial Intelligence</span><span class="ar">الشعار: الذكاء الاصطناعي في الرعاية الصحية</span></p></div>'),
          ('<div class="conference-item"><div class="year"><span class="en">2024 · 3rd</span><span class="ar">2024 · الثالث</span></div><h4><span class="en">Medical Education Conference</span><span class="ar">مؤتمر التعليم الطبي الثالث</span></h4><p><span class="en">Innovation in Medical Education</span><span class="ar">الابتكار في التعليم الطبي</span></p></div>',
           '<div class="conference-item"><div class="year"><span class="en">2024 · 3rd</span><span class="ar">2024 · الثالث</span></div><h4><span class="en">3rd Medical Education Conference</span><span class="ar">المؤتمر السنوي الثالث للتعليم الطبي</span></h4><p class="conference-role"><span class="en">Conference Committee Chair</span><span class="ar">رئيسة لجنة المؤتمر</span></p><p><span class="en">Theme: Innovation in Medical Education</span><span class="ar">الشعار: الابتكار في التعليم الطبي</span></p></div>'),
          ('<div class="conference-item"><div class="year"><span class="en">2025 · 4th</span><span class="ar">2025 · الرابع</span></div><h4><span class="en">Medical Education Conference</span><span class="ar">مؤتمر التعليم الطبي الرابع</span></h4><p><span class="en">AI and Medical Education: Partnership for Resilient Healthcare</span><span class="ar">الذكاء الاصطناعي والتعليم الطبي: شراكة لرعاية صحية مرنة</span></p></div>',
           '<div class="conference-item"><div class="year"><span class="en">2025 · 4th</span><span class="ar">2025 · الرابع</span></div><h4><span class="en">4th Medical Education Conference</span><span class="ar">المؤتمر السنوي الرابع للتعليم الطبي</span></h4><p class="conference-role"><span class="en">Conference Committee Chair</span><span class="ar">رئيسة لجنة المؤتمر</span></p><p><span class="en">Theme: AI and Medical Education: Partnership for Resilient Healthcare</span><span class="ar">الشعار: الذكاء الاصطناعي والتعليم الطبي: شراكة من أجل رعاية صحية مرنة</span></p></div>'),
          ('<div class="conference-item planned"><div class="year"><span class="en">2026 · 5th</span><span class="ar">2026 · الخامس</span></div><h4><span class="en">Medical Education Leadership Summit</span><span class="ar">قمة قيادة التعليم الطبي</span></h4><p><span class="en">From Innovation to Measurable Impact and Sustainable System · From AI to Responsible Intelligence</span><span class="ar">من الابتكار إلى أثر قابل للقياس ونظام مستدام · من الذكاء الاصطناعي إلى الذكاء المسؤول</span></p></div>',
           '<div class="conference-item"><div class="year"><span class="en">2026 · 5th</span><span class="ar">2026 · الخامسة</span></div><h4><span class="en">5th Medical Education Leadership Summit</span><span class="ar">قمة قيادات التعليم الطبي الخامسة</span></h4><p class="conference-role"><span class="en">Conference Committee Chair</span><span class="ar">رئيسة لجنة المؤتمر</span></p><p><span class="en">Theme: From Innovation to Measurable Impact and Sustainable System · From AI to Responsible Intelligence</span><span class="ar">الشعار: من الابتكار إلى الأثر الملموس والنظام المستدام · ومن الذكاء الاصطناعي إلى الذكاء المسؤول</span></p></div>')]
          for old,new in cards:
              if old in t:
                  t=t.replace(old,new,1)
          if '.conference-role{' not in t:
              t=t.replace('.conference-item p{margin:0;color:#64737A;font-size:.77rem;line-height:1.55}', '.conference-item p{margin:0;color:#64737A;font-size:.77rem;line-height:1.55}.conference-role{margin:8px 0!important;color:var(--teal-800)!important;font-weight:700!important}')

          # Required assertions before writing.
          required=['Conference Committee Chair','رئيسة لجنة المؤتمر','قمة قيادات التعليم الطبي الخامسة','📄','📷','📝','King_Fahd_Medal_Closeup_2019.jpg?v=20260814-5']
          for x in required:
              if x not in t: raise SystemExit('Missing expected content: '+x)
          p.write_text(t,encoding='utf-8')
          PY

      - name: Update downloadable CV
        run: |
          python -m pip install --quiet reportlab pypdf
          python - <<'PY'
          from pathlib import Path
          from reportlab.lib import colors
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, Table, TableStyle
          from pypdf import PdfReader, PdfWriter

          cv=Path('assets/Dr_Adeelah_Qattan_CV_2026.pdf')
          reader=PdfReader(str(cv))
          meta=reader.metadata or {}
          if meta.get('/ConferenceLeadershipUpdate')!='2026-08-14-v2':
              add=Path('/tmp/conference-leadership.pdf')
              doc=SimpleDocTemplate(str(add),pagesize=A4,rightMargin=30,leftMargin=30,topMargin=36,bottomMargin=36)
              styles=getSampleStyleSheet()
              title=ParagraphStyle('t',parent=styles['Heading1'],fontName='Helvetica-Bold',fontSize=19,leading=22,textColor=colors.HexColor('#0F3D44'),spaceAfter=7)
              note=ParagraphStyle('n',parent=styles['BodyText'],fontName='Helvetica',fontSize=9,leading=12,textColor=colors.HexColor('#596970'),spaceAfter=15)
              cell=ParagraphStyle('c',parent=styles['BodyText'],fontName='Helvetica',fontSize=7.7,leading=10,textColor=colors.HexColor('#26363B'))
              head=ParagraphStyle('h',parent=cell,fontName='Helvetica-Bold',textColor=colors.white)
              story=[Paragraph('Conference Leadership Record (2023–2026)',title),Paragraph('Dr. Adeelah Talat Qattan served as Conference Committee Chair across the annual Medical Education Conference series and the 5th Medical Education Leadership Summit.',note)]
              rows=[
                ['2023','2nd Medical Education Conference','Conference Committee Chair','Healthcare Artificial Intelligence'],
                ['2024','3rd Medical Education Conference','Conference Committee Chair','Innovation in Medical Education'],
                ['2025','4th Medical Education Conference','Conference Committee Chair','AI and Medical Education: Partnership for Resilient Healthcare'],
                ['2026','5th Medical Education Leadership Summit','Conference Committee Chair','From Innovation to Measurable Impact and Sustainable System · From AI to Responsible Intelligence']]
              data=[[Paragraph(x,head) for x in ['Year','Event','Leadership Role','Theme / Slogan']]]+[[Paragraph(x,cell) for x in r] for r in rows]
              tab=Table(data,colWidths=[38,142,112,242],repeatRows=1,hAlign='LEFT')
              tab.setStyle(TableStyle([('BACKGROUND',(0,0),(-1,0),colors.HexColor('#0F3D44')),('GRID',(0,0),(-1,-1),0.45,colors.HexColor('#D9E4E6')),('VALIGN',(0,0),(-1,-1),'TOP'),('LEFTPADDING',(0,0),(-1,-1),6),('RIGHTPADDING',(0,0),(-1,-1),6),('TOPPADDING',(0,0),(-1,-1),7),('BOTTOMPADDING',(0,0),(-1,-1),7),('ROWBACKGROUNDS',(0,1),(-1,-1),[colors.white,colors.HexColor('#F5FAFA')])]))
              story += [tab,Spacer(1,12),Paragraph('Updated to align the downloadable CV with the current professional portfolio.',note)]
              doc.build(story)
              writer=PdfWriter()
              for pg in reader.pages: writer.add_page(pg)
              for pg in PdfReader(str(add)).pages: writer.add_page(pg)
              clean={k:str(v) for k,v in dict(meta).items() if v is not None}
              clean['/ConferenceLeadershipUpdate']='2026-08-14-v2'
              writer.add_metadata(clean)
              with cv.open('wb') as f: writer.write(f)
          PY

      - name: Quality gate
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          t=Path('index.html').read_text(encoding='utf-8')
          assert t.count('Conference Committee Chair') >= 5
          assert t.count('رئيسة لجنة المؤتمر') >= 5
          assert '2026 · الخامسة' in t
          assert 'من الابتكار إلى الأثر الملموس والنظام المستدام' in t
          assert 'html[lang="en"] .ar{display:none!important}' in t
          assert 'html[lang="ar"] .en{display:none!important}' in t
          assert all(icon in t for icon in ['📄','📷','📝'])
          medal=Path('assets/King_Fahd_Medal_Closeup_2019.jpg').read_bytes()
          assert len(medal)==20846 and medal[:2]==b'\xff\xd8' and medal[-2:]==b'\xff\xd9'
          r=PdfReader('assets/Dr_Adeelah_Qattan_CV_2026.pdf')
          assert (r.metadata or {}).get('/ConferenceLeadershipUpdate')=='2026-08-14-v2'
          print('PASS: bilingual portfolio, medal, conference record, buttons and CV verified; CV pages=',len(r.pages))
          PY

      - name: Commit verified update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/King_Fahd_Medal_Closeup_2019.jpg assets/Dr_Adeelah_Qattan_CV_2026.pdf
          git commit -m 'feat: publish verified conference leadership medal and CV update'
          git push origin HEAD:main
