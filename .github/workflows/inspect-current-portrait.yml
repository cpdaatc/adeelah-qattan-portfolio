name: Inspect current portrait
on:
  push:
    paths:
      - '.github/workflows/inspect-current-portrait.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from PIL import Image,ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES=False
          p='assets/portrait.jpg'
          im=Image.open(p); print(im.size, im.mode); im.verify()
          im=Image.open(p).convert('RGB'); im.save('portrait-current.png')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: current-portrait-png
          path: portrait-current.png
