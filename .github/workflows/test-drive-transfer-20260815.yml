name: Test Drive transfer 20260815
on:
  push:
    paths:
      - '.github/workflows/test-drive-transfer-20260815.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test portrait download endpoints
        shell: bash
        run: |
          set -u
          ID='1M5oLQP4N_SZtaXZvDsW8H94uepfbN1uo'
          EXPECTED='823bc3846a4ce1a09e2811755306cf17cdfc5af9a19feb9b2e9ac1a051a4c462'
          urls=(
            "https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t"
            "https://drive.google.com/uc?export=download&id=${ID}&confirm=t"
            "https://drive.google.com/uc?id=${ID}&export=download"
          )
          ok=0
          for i in 0 1 2; do
            echo "TRY $i"
            curl -L --fail --silent --show-error --max-time 60 -o "/tmp/p${i}" "${urls[$i]}" || { echo "curl failed"; continue; }
            wc -c "/tmp/p${i}"
            sha=$(sha256sum "/tmp/p${i}" | cut -d' ' -f1)
            echo "sha256=$sha"
            file "/tmp/p${i}" || true
            if [ "$sha" = "$EXPECTED" ]; then ok=1; echo 'EXACT_PORTRAIT_MATCH'; break; fi
          done
          test "$ok" -eq 1
      - name: Test certificate download endpoints
        shell: bash
        run: |
          set -u
          ID='1Y9f1V9vL4f1AFKKfDdL-Jf7hf-lcLevo'
          EXPECTED='974d85bed1a071afe3ad3e66901d57c9d250dc72e1b4541d148edc2f4cae7331'
          urls=(
            "https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t"
            "https://drive.google.com/uc?export=download&id=${ID}&confirm=t"
            "https://drive.google.com/uc?id=${ID}&export=download"
          )
          ok=0
          for i in 0 1 2; do
            echo "TRY $i"
            curl -L --fail --silent --show-error --max-time 60 -o "/tmp/c${i}" "${urls[$i]}" || { echo "curl failed"; continue; }
            wc -c "/tmp/c${i}"
            sha=$(sha256sum "/tmp/c${i}" | cut -d' ' -f1)
            echo "sha256=$sha"
            file "/tmp/c${i}" || true
            if [ "$sha" = "$EXPECTED" ]; then ok=1; echo 'EXACT_CERTIFICATE_MATCH'; break; fi
          done
          test "$ok" -eq 1
