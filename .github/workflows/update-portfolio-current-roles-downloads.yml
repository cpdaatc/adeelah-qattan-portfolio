name: Update current roles downloads and bilingual controls

on:
  push:
    paths:
      - '.github/workflows/update-portfolio-current-roles-downloads.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update portfolio content and bilingual controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')

          # Metadata: current institutional title includes Academic Affairs & Training.
          t=t.replace('Assistant Hospital Director for Academic Affairs, and Director of Medical Education and Training.', 'Assistant Hospital Director for Academic Affairs & Training, and Director of Medical Education and Training.')
          t=t.replace('Assistant Hospital Director for Academic Affairs, and Director of Medical Education and Training.', 'Assistant Hospital Director for Academic Affairs & Training, and Director of Medical Education and Training.')

          # Remove desktop print control. Download resources live in the side panel only.
          desktop_print='''        <button class="control print-top" onclick="window.print()" aria-label="Print CV"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 8V3h10v5M7 17H5a2 2 0 0 1-2-2v-4a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v4a2 2 0 0 1-2 2h-2M7 14h10v7H7z"/></svg><span class="en">Print CV</span><span class="ar">طباعة السيرة</span></button>\n'''
          if desktop_print in t:
              t=t.replace(desktop_print,'',1)

          # Replace the side-panel print action with actual downloadable resources.
          old_side='''    <button class="btn btn-primary" style="margin-top:22px;width:100%" onclick="window.print()"><span class="en">Print / Save CV as PDF</span><span class="ar">طباعة / حفظ السيرة PDF</span></button>'''
          new_side='''    <div class="sidebar-downloads">
      <a class="btn btn-primary resource-download" href="assets/Dr_Adeelah_Qattan_CV_2026.pdf" download><span class="en">Download CV (PDF)</span><span class="ar">تحميل السيرة الذاتية (PDF)</span></a>
      <a class="btn btn-ghost resource-download" href="assets/Dr_Adeelah_Qattan_Portrait_High_Resolution.jpg" download><span class="en">Download Personal Photo</span><span class="ar">تحميل الصورة الشخصية</span></a>
      <a class="btn btn-ghost resource-download" href="assets/Dr_Adeelah_Qattan_Speaker_Bio_Bilingual.pdf" download><span class="en">Download Speaker Bio (PDF)</span><span class="ar">تحميل النبذة التعريفية (PDF)</span></a>
    </div>'''
          if old_side not in t:
              raise SystemExit('sidebar print action not found')
          t=t.replace(old_side,new_side,1)

          # Current titles in hero.
          old_role='''          <div class="role"><strong class="en">Assistant Hospital Director</strong><strong class="ar">مساعد مدير المستشفى</strong> — <span class="en">Academic Affairs</span><span class="ar">للشؤون الأكاديمية</span></div>'''
          new_role='''          <div class="role"><strong class="en">Assistant Hospital Director</strong><strong class="ar">المساعد لمدير المستشفى</strong> — <span class="en">Academic Affairs &amp; Training</span><span class="ar">للشؤون الأكاديمية والتدريب</span></div>'''
          if old_role not in t: raise SystemExit('hero assistant role not found')
          t=t.replace(old_role,new_role,1)

          old_director='''          <div class="role"><strong class="en">Director</strong><strong class="ar">مدير</strong> — <span class="en">Medical Education &amp; Training</span><span class="ar">التعليم الطبي والتدريب</span></div>'''
          new_director='''          <div class="role"><strong class="en">Director</strong><strong class="ar">مدير</strong> — <span class="en">Medical Education &amp; Training Department</span><span class="ar">إدارة التعليم الطبي والتدريب</span></div>'''
          if old_director not in t: raise SystemExit('hero director role not found')
          t=t.replace(old_director,new_director,1)

          # Leadership narrative.
          t=t.replace('and currently serving as Assistant Hospital Director for Academic Affairs.', 'and currently serving as Assistant Hospital Director for Academic Affairs & Training.')
          t=t.replace('وصولًا إلى دورها الحالي كمساعد مدير المستشفى للشؤون الأكاديمية.', 'وصولًا إلى دورها الحالي كمساعد لمدير المستشفى للشؤون الأكاديمية والتدريب.')

          # Career titles.
          t=t.replace('<span class="en">Assistant Hospital Director for Academic Affairs</span><span class="ar">مساعد مدير المستشفى للشؤون الأكاديمية</span>', '<span class="en">Assistant Hospital Director for Academic Affairs &amp; Training</span><span class="ar">المساعد لمدير المستشفى للشؤون الأكاديمية والتدريب</span>', 1)
          t=t.replace('<span class="en">Director, Medical Education &amp; Training</span><span class="ar">مدير التعليم الطبي والتدريب</span>', '<span class="en">Director, Medical Education &amp; Training Department</span><span class="ar">مدير إدارة التعليم الطبي والتدريب</span>', 1)

          # Current institutional leadership / committee roles, kept out of the hero to avoid clutter.
          roles_section='''
      <div class="current-roles reveal" aria-labelledby="currentRolesTitle">
        <div class="current-roles-heading">
          <div><small>Current Institutional Roles</small><h3 id="currentRolesTitle"><span class="en">Leadership &amp; Committee Responsibilities</span><span class="ar">المسؤوليات القيادية واللجان الحالية</span></h3></div>
          <p class="en">Current hospital-level leadership, governance, education, development and research responsibilities.</p>
          <p class="ar">المسؤوليات الحالية على مستوى المستشفى في القيادة والحوكمة والتعليم والتطوير والبحث.</p>
        </div>
        <div class="current-roles-grid">
          <div class="current-role-card"><span class="en">Assistant Hospital Director for Academic Affairs &amp; Training</span><span class="ar">المساعد لمدير المستشفى للشؤون الأكاديمية والتدريب</span></div>
          <div class="current-role-card"><span class="en">Director, Medical Education &amp; Training Department</span><span class="ar">مدير إدارة التعليم الطبي والتدريب</span></div>
          <div class="current-role-card"><span class="en">Chair, Hospital Scholarship &amp; External Assignment Committee</span><span class="ar">رئيس لجنة الابتعاث والإيفاد بالمستشفى</span></div>
          <div class="current-role-card"><span class="en">Member, Senior Human Resources Management Committee</span><span class="ar">عضو لجنة إدارة الموارد البشرية العليا</span></div>
          <div class="current-role-card"><span class="en">Member, Senior Advisory Committee Team</span><span class="ar">عضو فريق اللجنة الاستشارية العليا</span></div>
          <div class="current-role-card"><span class="en">Member, Postgraduate Education &amp; Training Committee</span><span class="ar">عضو لجنة التعليم والتدريب للدراسات العليا</span></div>
          <div class="current-role-card"><span class="en">Chair, Hospital Continuing Professional Development Committee</span><span class="ar">رئيس لجنة التطوير المهني المستمر بالمستشفى</span></div>
          <div class="current-role-card"><span class="en">Chair, Weekly Activities &amp; External Conferences Committee</span><span class="ar">رئيس لجنة الفعاليات الأسبوعية والمؤتمرات الخارجية</span></div>
          <div class="current-role-card"><span class="en">Chair, Train-the-Trainer Committee for Physicians &amp; Healthcare Professionals</span><span class="ar">رئيس لجنة تدريب المدربين للأطباء والصحيين</span></div>
          <div class="current-role-card"><span class="en">Member, Hospital Leadership Team &amp; Steering Committee</span><span class="ar">عضو الفريق القيادي واللجنة التوجيهية بالمستشفى</span></div>
          <div class="current-role-card"><span class="en">Member, Research Committee</span><span class="ar">عضو لجنة الأبحاث</span></div>
          <div class="current-role-card"><span class="en">Member, Ethics Committee</span><span class="ar">عضو لجنة الأخلاقيات</span></div>
        </div>
      </div>
'''
          marker='''      <div class="impact-list reveal">'''
          if 'id="currentRolesTitle"' not in t:
              if marker not in t: raise SystemExit('leadership insertion marker not found')
              t=t.replace(marker,roles_section+marker,1)

          # Actual supplied King Fahd Medal documentation image in royal section.
          old_mark='''      <div class="royal-mark" aria-hidden="true"><div class="royal-star">★</div></div>'''
          new_mark='''      <figure class="royal-document">
        <img src="assets/King_Fahd_Medal_Third_Degree_2019.jpg" alt="King Fahd Medal — Third Degree, 2019 documentation">
        <figcaption><span class="en">King Fahd Medal — Third Degree · 2019</span><span class="ar">ميدالية الملك فهد — الدرجة الثالثة · 2019</span></figcaption>
      </figure>'''
          if old_mark not in t: raise SystemExit('royal visual marker not found')
          t=t.replace(old_mark,new_mark,1)

          # Footer current role and both emails. Hotmail is Mumaris+; Gmail remains available.
          old_footer_role='''<span class="en">Assistant Hospital Director for Academic Affairs · Director, Medical Education &amp; Training · Consultant, Restorative Dentistry</span><span class="ar">مساعد مدير المستشفى للشؤون الأكاديمية · مدير التعليم الطبي والتدريب · استشاري إصلاح الأسنان</span>'''
          new_footer_role='''<span class="en">Assistant Hospital Director for Academic Affairs &amp; Training · Director, Medical Education &amp; Training Department · Consultant, Restorative Dentistry</span><span class="ar">المساعد لمدير المستشفى للشؤون الأكاديمية والتدريب · مدير إدارة التعليم الطبي والتدريب · استشاري إصلاح الأسنان</span>'''
          if old_footer_role not in t: raise SystemExit('footer role not found')
          t=t.replace(old_footer_role,new_footer_role,1)

          old_contacts='''<a href="mailto:adeelahqattan@gmail.com">adeelahqattan@gmail.com</a><a href="mailto:atqattan@hotmail.com">atqattan@hotmail.com</a>'''
          new_contacts='''<a href="mailto:atqattan@hotmail.com"><span class="en">Mumaris+: atqattan@hotmail.com</span><span class="ar">ممارس+: atqattan@hotmail.com</span></a><a href="mailto:adeelahqattan@gmail.com"><span class="en">Additional Email: adeelahqattan@gmail.com</span><span class="ar">بريد إضافي: adeelahqattan@gmail.com</span></a>'''
          if old_contacts not in t: raise SystemExit('footer emails not found')
          t=t.replace(old_contacts,new_contacts,1)

          # Styling for actual honour image, current-role matrix and side-panel downloads.
          css='''
    .sidebar-downloads{display:grid;gap:10px;margin-top:22px}.resource-download{width:100%;min-height:50px}.royal-document{margin:0;position:relative;border:1px solid rgba(201,169,97,.65);padding:8px;background:#fff;border-radius:18px;box-shadow:0 24px 55px rgba(0,0,0,.2);overflow:hidden}.royal-document img{display:block;width:100%;height:auto;border-radius:11px}.royal-document figcaption{padding:10px 8px 4px;color:var(--teal-950);font-size:.68rem;font-weight:600;text-align:center}.current-roles{margin-top:46px;padding-top:40px;border-top:1px solid var(--line)}.current-roles-heading{display:flex;justify-content:space-between;gap:28px;align-items:end;margin-bottom:22px}.current-roles-heading small{display:block;color:var(--teal-600);font-size:.66rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase}.current-roles-heading h3{margin:5px 0 0;color:var(--teal-950);font:600 2rem/1.05 "Cormorant Garamond",serif}.current-roles-heading p{max-width:430px;margin:0;color:var(--muted);font-size:.82rem}.current-roles-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.current-role-card{min-height:92px;padding:18px 18px 18px 21px;border:1px solid var(--line);border-radius:15px;background:#fff;color:#36474E;font-size:.8rem;font-weight:500;display:flex;align-items:center;position:relative}.current-role-card:before{content:"";position:absolute;inset:13px auto 13px 0;width:3px;border-radius:3px;background:linear-gradient(var(--teal-600),var(--gold))}html[dir="rtl"] .current-role-card{padding:18px 21px 18px 18px}html[dir="rtl"] .current-role-card:before{left:auto;right:0}.royal-grid{grid-template-columns:minmax(250px,310px) 1fr}
    @media(max-width:980px){.current-roles-grid{grid-template-columns:1fr 1fr}.current-roles-heading{display:block}.current-roles-heading p{margin-top:10px}.royal-grid{grid-template-columns:1fr}.royal-document{max-width:310px;margin:auto}}
    @media(max-width:650px){.current-roles-grid{grid-template-columns:1fr}.current-role-card{min-height:auto}.current-roles{margin-top:34px;padding-top:30px}}
'''
          if '.sidebar-downloads{' not in t:
              t=t.replace('    .career{max-width:900px;margin:auto}',css+'    .career{max-width:900px;margin:auto}',1)

          p.write_text(t,encoding='utf-8')
          PY

      - name: Create updated accreditation CV and speaker bio source
        run: |
          cat > cv-download.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><style>
          @page{size:A4;margin:0}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#243238;background:#fff}.page{width:210mm;height:297mm;padding:12mm 14mm;page-break-after:always;overflow:hidden}.page:last-child{page-break-after:auto}.top{display:grid;grid-template-columns:1fr 31mm;gap:8mm;align-items:center;border-bottom:3px solid #1F5F6B;padding-bottom:6mm}.top img{width:31mm;height:31mm;border-radius:50%;object-fit:cover;border:2px solid #C9A961}.eyebrow{font-size:8pt;letter-spacing:1.5px;color:#2E8B96;font-weight:700}.name{font-family:Georgia,serif;color:#0F3D44;font-size:25pt;margin:2mm 0 1mm}.roles{font-size:9.2pt;line-height:1.45;font-weight:600}.contact{font-size:7.7pt;color:#58666c;margin-top:2.5mm}.honour{margin:5mm 0;padding:3mm 4mm;background:#0F3D44;color:#fff;border-left:4px solid #C9A961;font-size:8.5pt}.honour b{color:#E7D39F}.sec{margin-top:4.5mm}.sec h2{margin:0 0 2.4mm;font-size:9pt;color:#1F5F6B;letter-spacing:.8px;text-transform:uppercase;border-bottom:1px solid #D9E4E6;padding-bottom:1.5mm}.sec p,.sec li{font-size:7.65pt;line-height:1.42;margin:0}.sec ul{margin:1.5mm 0 0;padding-left:4.5mm}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:2.4mm 4mm}.item{border:1px solid #D9E4E6;border-radius:3mm;padding:2.5mm}.item b{display:block;color:#0F3D44;font-size:7.8pt;margin-bottom:.5mm}.item span{font-size:7.15pt;color:#536269}.rolesgrid{display:grid;grid-template-columns:1fr 1fr;gap:2mm}.roleitem{padding:2.2mm 2.8mm;border-left:2px solid #2E8B96;background:#F6FAFA;font-size:7.15pt;line-height:1.35}.timeline{display:grid;grid-template-columns:28mm 1fr;gap:2mm 4mm}.timeline b{font-size:7.4pt;color:#2E8B96}.timeline div{font-size:7.35pt;line-height:1.35}.foot{position:absolute;bottom:7mm;left:14mm;right:14mm;border-top:1px solid #D9E4E6;padding-top:2mm;color:#78858a;font-size:6.5pt}.page{position:relative}
          </style></head><body>
          <section class="page">
            <div class="top"><div><div class="eyebrow">PROFESSIONAL CV · CPD / SCIENTIFIC ACTIVITY ACCREDITATION</div><div class="name">DR. ADEELAH TALAT QATTAN</div><div class="roles">Consultant, Restorative Dentistry · Assistant Hospital Director for Academic Affairs &amp; Training · Director, Medical Education &amp; Training Department</div><div class="contact">King Fahd Armed Forces Hospital — Jeddah, KSA · Mobile: 0504308308 | 0530755559 · Office: (012) 232-8888 ext. 32000<br><b>Mumaris+ Email:</b> atqattan@hotmail.com · <b>Additional Email:</b> adeelahqattan@gmail.com</div></div><img src="assets/Dr_Adeelah_Qattan_Portrait_High_Resolution.jpg" alt="Dr. Adeelah Qattan"></div>
            <div class="honour"><b>ROYAL HONOUR · 2019</b> — KING FAHD MEDAL, THIRD DEGREE</div>
            <div class="sec"><h2>01 · Professional Profile</h2><p>Distinguished Consultant in Restorative Dentistry and senior healthcare academic leader with extensive service at King Fahd Armed Forces Hospital, Jeddah. Her current portfolio combines clinical practice with executive leadership in Academic Affairs &amp; Training and Medical Education &amp; Training. Her experience includes SCFHS institutional accreditation, CPD provider governance, faculty development, postgraduate training, scholarship planning, quality improvement, research ethics, digital transformation and institutional strategy. She founded and directed the Restorative Dentistry Saudi Board Program at KFAFH for 10 years and supervised 8 graduating candidates.</p></div>
            <div class="sec"><h2>02 · Academic Qualifications &amp; Professional Certifications</h2><div class="grid2">
              <div class="item"><b>2006 · Certified Consultant / Saudi Board</b><span>Saudi Commission for Health Specialties · Restorative Dentistry · Cert. No. 06/R/D/90</span></div>
              <div class="item"><b>2003–2006 · Saudi Specialty Certificate</b><span>Restorative Dentistry · SCFHS · No. R/20016798</span></div>
              <div class="item"><b>2000 · Master’s Degree</b><span>Restorative Dentistry · King Saud University, Riyadh</span></div>
              <div class="item"><b>1997–2000 · Postgraduate Clinical Certificate</b><span>Restorative Dental Science · King Saud University</span></div>
              <div class="item"><b>1992 · Bachelor’s Degree in Dentistry</b><span>King Saud University, Riyadh</span></div>
              <div class="item"><b>Current Professional Credentials</b><span>TOT certified through 31 Dec 2027 · Research &amp; Bioethics (NCBE) through 29 Apr 2027</span></div>
            </div></div>
            <div class="sec"><h2>03 · Current Appointments &amp; Academic Leadership</h2><div class="timeline">
              <b>Jan 2023 — Present</b><div><strong>Assistant Hospital Director for Academic Affairs &amp; Training</strong><br>Leads institutional accreditation readiness, academic planning, CPD governance, training capacity, scholarship strategy, academic reporting and hospital-wide education and training governance.</div>
              <b>Oct 2017 — Present</b><div><strong>Director, Medical Education &amp; Training Department</strong><br>Leads medical education and training systems, training standards, faculty development and academic digital transformation, including the KFAFH Learning Management System.</div>
              <b>2006 — Present</b><div><strong>Consultant, Restorative Dentistry</strong><br>Consultant-level clinical practice with long-standing postgraduate training, mentorship and clinical governance experience.</div>
            </div></div>
            <div class="foot">Dr. Adeelah Talat Qattan · Professional CV · Updated 2026</div>
          </section>
          <section class="page">
            <div class="sec"><h2>04 · Current Institutional Leadership &amp; Committee Roles</h2><div class="rolesgrid">
              <div class="roleitem">Assistant Hospital Director for Academic Affairs &amp; Training</div><div class="roleitem">Director, Medical Education &amp; Training Department</div>
              <div class="roleitem">Chair, Hospital Scholarship &amp; External Assignment Committee</div><div class="roleitem">Member, Senior Human Resources Management Committee</div>
              <div class="roleitem">Member, Senior Advisory Committee Team</div><div class="roleitem">Member, Postgraduate Education &amp; Training Committee</div>
              <div class="roleitem">Chair, Hospital Continuing Professional Development Committee</div><div class="roleitem">Chair, Weekly Activities &amp; External Conferences Committee</div>
              <div class="roleitem">Chair, Train-the-Trainer Committee for Physicians &amp; Healthcare Professionals</div><div class="roleitem">Member, Hospital Leadership Team &amp; Steering Committee</div>
              <div class="roleitem">Member, Research Committee</div><div class="roleitem">Member, Ethics Committee</div>
            </div></div>
            <div class="sec"><h2>05 · Selected Previous Leadership Experience</h2><div class="timeline">
              <b>2011 — 2022</b><div><strong>Head, Restorative Dental Division</strong> — SCFHS trainer; divisional strategy, clinical pathways, continuing education governance and KPI-driven performance.</div>
              <b>2009 — 2017</b><div><strong>Assistant Director, Dental Department</strong> — electronic physician performance indicators, productivity metrics, appointment systems and operating-room utilisation planning.</div>
              <b>2002 — 2011</b><div><strong>Program Director, Restorative Dentistry Saudi Board</strong> — founded and led the KFAFH program for 10 years; supervised 8 graduating candidates.</div>
            </div></div>
            <div class="sec"><h2>06 · Selected Education, Training &amp; Scientific Activities</h2><div class="timeline">
              <b>Apr 2024</b><div>NCBE — National Committee of Bioethics, SCFHS</div><b>Dec 2023</b><div>Train the Trainer for Healthcare Practitioners — Healthcare Leadership Academy</div><b>Mar 2022</b><div>Emotional Intelligence for Healthcare Leaders</div><b>Sep 2021</b><div>Train the Trainer for Healthcare Practitioners — Royal College of Surgeons in Ireland</div><b>2021</b><div>Building High-Performing Healthcare Teams; Research Ethics Committee Workshop; Clinical Leaders as Trainer; Sharp Thinking for Successful Action</div>
            </div></div>
            <div class="sec"><h2>07 · Quality, Research &amp; Accreditation Leadership</h2><ul><li>2025 — Academic Sustainability in Trainer Qualification (TOT), QIP 778 (Level 2), team-leader quality project with associated research manuscript pathway (BMC / REC 899).</li><li>2024 — Innovative Strategies to Enhance Life Support Training and Improve Healthcare Staff Competency, QIP 328 (Level 2), team-leader quality project with research work in progress.</li><li>Ongoing — Enhancing Patient Trust in Emergency Department Interactions, trainee-led quality initiative with research manuscript work in progress.</li><li>Led or supported SCFHS Institutional Accreditation, CPD Provider accreditation, AHA Life Support Training Center accreditation, CBAHI recognition and JCI accreditation support.</li></ul></div>
            <div class="sec"><h2>08 · Selected Honours &amp; Recognition</h2><div class="timeline"><b>2019</b><div>King Fahd Medal — Third Degree, awarded by the Custodian of the Two Holy Mosques, King Salman Bin Abdul Aziz Al Saud, for excellence in service.</div><b>2025</b><div>Certificate of Appreciation — Saudi Quality Council, Second Cycle of the Scientific Research Award in Quality &amp; Institutional Excellence.</div><b>2024 / 2018 / 2016</b><div>Medical Education Conference appreciation; CBAHI Hospital Accreditation recognition; Joint Commission International Accreditation recognition.</div></div></div>
            <div class="sec"><h2>09 · Core Expertise</h2><p>Restorative &amp; Esthetic Dentistry · Medical Education &amp; Faculty Development · SCFHS Accreditation &amp; CPD Governance · Postgraduate Training · Train-the-Trainer · Academic Strategy &amp; Governance · Clinical Quality Improvement · Research &amp; Bioethics · Committee Leadership · Digital Transformation</p></div>
            <div class="foot">Mumaris+: atqattan@hotmail.com · Additional Email: adeelahqattan@gmail.com</div>
          </section>
          </body></html>
          EOF

          cat > speaker-bio.html <<'EOF'
          <!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
          @page{size:A4;margin:16mm}*{box-sizing:border-box}body{font-family:Arial,Tahoma,sans-serif;color:#26363b;margin:0}.wrap{border-top:6px solid #0F3D44;padding-top:12mm}.name{font-family:Georgia,serif;font-size:26pt;color:#0F3D44;margin:0}.sub{color:#2E8B96;font-size:9pt;font-weight:700;margin:2mm 0 10mm}.box{background:#F2F8F9;border-right:4px solid #C9A961;border-radius:4mm;padding:7mm;margin-bottom:9mm}.box h2{font-size:11pt;color:#0F3D44;margin:0 0 4mm}.box p{font-size:10.5pt;line-height:1.9;margin:0 0 3mm}.en{direction:ltr;text-align:left;border-right:0;border-left:4px solid #C9A961}.en p{font-size:10pt;line-height:1.65}.foot{font-size:8pt;color:#6b777c;border-top:1px solid #D9E4E6;padding-top:4mm;text-align:center}</style></head><body><div class="wrap"><h1 class="name">د. عديلة طلعت قطان</h1><div class="sub">Speaker Biography · نبذة تعريفية للمتحدثة</div><section class="box"><h2>النبذة التعريفية</h2><p>د. عديلة طلعت قطان، استشارية إصلاح الأسنان ومساعد مدير المستشفى للشؤون الأكاديمية والتدريب، تمتلك خبرة قيادية في التعليم والتدريب الطبي وتطوير الكفاءات الصحية.</p><p>أسهمت في قيادة مبادرات ومشروعات تطويرية تهدف إلى تعزيز جودة التدريب، بناء القدرات، ورفع الكفاءة المؤسسية.</p><p>وتهتم بتطوير القيادات وتمكين المرأة في القطاع الصحي، وربط التطور المهني بالمستقبل المتغير للممارسة والقيادة في المجال الطبي.</p></section><section class="box en"><h2>English Biography</h2><p>Dr. Adeelah Talat Qattan is a Consultant in Restorative Dentistry and Assistant Hospital Director for Academic Affairs &amp; Training, with leadership experience in medical education and training and the development of healthcare professionals.</p><p>She has contributed to leading development initiatives and projects aimed at strengthening training quality, building capacity, and improving institutional efficiency.</p><p>Her interests include leadership development, women’s empowerment in the healthcare sector, and aligning professional development with the evolving future of medical practice and leadership.</p></section><div class="foot">King Fahd Armed Forces Hospital · Jeddah, Kingdom of Saudi Arabia</div></div></body></html>
          EOF

      - name: Generate downloadable PDFs
