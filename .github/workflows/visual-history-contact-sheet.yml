name: Visual history contact sheet

on:
  push:
    paths:
      - '.github/workflows/visual-history-contact-sheet.yml'

permissions:
  contents: read

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install imaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick python3-pil
      - name: Extract candidates and build contact sheets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-audit/portrait visual-audit/certificate
          python3 - <<'PY'
          from PIL import Image, ImageFile, ImageOps, ImageDraw
          from pathlib import Path
          import subprocess
          ImageFile.LOAD_TRUNCATED_IMAGES=True
          groups={
            'portrait':[
              ('P1-732e308','732e308023ed5b5e63c4a61683bfe643fcad35b4','jpg'),
              ('P2-dca4442','dca44423b2f02ab41e558730923bdd1e0f0d1306','jpg'),
              ('P3-3656609','3656609fcedf6801c71405b72d03589b8fafbedc','webp'),
              ('P4-0bf96a2','0bf96a218500619d9ee0cd9bb25d3ccb1b05d854','jpg'),
              ('P5-6ceed31','6ceed317148355ce9b642c039e1c5341ebcfba63','jpg'),
            ],
            'certificate':[
              ('C1-c7f8179','c7f81792a9809e930987561d77febc7b855b9a5f','jpg'),
              ('C2-332e9b4','332e9b46a6545440199c68a11dc5c0a0d912bb0a','jpg'),
              ('C3-0a099a9','0a099a9be2228fc22ceff6a4dd89be23f94c806b','jpg'),
              ('C4-7944703','794470399cdc22c74b3eea5237499b410355b135','jpg'),
              ('C5-f831d29','f831d295921e8b20f540f5dd4c0c95d93f817724','jpg'),
            ]
          }
          for group,items in groups.items():
            cards=[]
            for label,sha,ext in items:
              raw=Path('/tmp')/f'{label}.{ext}'
              raw.write_bytes(subprocess.check_output(['git','cat-file','blob',sha]))
              try:
                im=Image.open(raw).convert('RGB')
                im.thumbnail((260,260), Image.Resampling.LANCZOS)
                canvas=Image.new('RGB',(300,330),'white')
                x=(300-im.width)//2; y=12+(260-im.height)//2
                canvas.paste(im,(x,y))
                d=ImageDraw.Draw(canvas)
                d.text((12,285),label,fill='black')
                d.text((12,305),f'{Image.open(raw).size} {raw.stat().st_size}B',fill='black')
              except Exception as e:
                canvas=Image.new('RGB',(300,330),'white'); d=ImageDraw.Draw(canvas)
                d.text((12,145),label,fill='red'); d.text((12,170),str(e)[:45],fill='red')
              canvas.save(f'visual-audit/{group}/{label}.png')
              cards.append(canvas)
            sheet=Image.new('RGB',(300*len(cards),330),'#dddddd')
            for i,c in enumerate(cards): sheet.paste(c,(i*300,0))
            sheet.save(f'visual-audit/{group}-contact-sheet.png')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: visual-history-contact-sheets
          path: visual-audit
          if-no-files-found: error
