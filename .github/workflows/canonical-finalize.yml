name: Canonical portfolio finalization

on:
  push:
    paths:
      - '.github/workflows/canonical-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact portrait, certificate and final CV
        shell: bash
        run: |
          set -euo pipefail
          cat .canonical-upload/portrait-01.b64 .canonical-upload/portrait-02.b64 .canonical-upload/portrait-03.b64 .canonical-upload/portrait-04.b64 .canonical-upload/portrait-05.b64 .canonical-upload/portrait-06.b64 | tr -d '\r\n\t ' > /tmp/portrait-prefix.b64
          test "$(wc -c < /tmp/portrait-prefix.b64)" -eq 107708
          echo '8840e263904551fd3d5f8c424acec6d3494cdedb1977d04bbd272b96890d793a  /tmp/portrait-prefix.b64' | sha256sum -c -
          cat /tmp/portrait-prefix.b64 .canonical-upload/portrait-tail.b64 | tr -d '\r\n\t ' > /tmp/portrait-exact.b64
          test "$(wc -c < /tmp/portrait-exact.b64)" -eq 114372
          base64 -d /tmp/portrait-exact.b64 > assets/Dr_Adeelah_Qattan_Portrait_High_Resolution.jpg
          echo '0372e53f7d7d156eec9c2af0bc2e7b10dd67fb73e85534592119093dc982541a  assets/Dr_Adeelah_Qattan_Portrait_High_Resolution.jpg' | sha256sum -c -
          cp assets/Dr_Adeelah_Qattan_Portrait_High_Resolution.jpg assets/portrait.jpg
          git show 03b07633bdc8b68119ee021034511a0e985abbdb:assets/King_Fahd_Medal_Third_Degree_2019.jpg > assets/King_Fahd_Medal_Certificate_2019.jpg
          git show 42f4250d96f90fb941d84cc1d940642f2480c68e:assets/Dr_Adeelah_Qattan_CV_2026.pdf > assets/Dr_Adeelah_Qattan_CV_2026.pdf
          file assets/Dr_Adeelah_Qattan_Portrait_High_Resolution.jpg assets/King_Fahd_Medal_Certificate_2019.jpg

      - name: Apply canonical portfolio and run stable-state audit
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/cert_file.stat().st_size > 20000/cert_file.stat().st_size > 5000/' scripts/canonical_finalize.py
          sed -i 's/cw >= 500 and ch > cw/cw >= 200 and ch > cw/' scripts/canonical_finalize.py
          python scripts/canonical_finalize.py

      - name: Remove regression sources and staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp .canonical-upload
          rm -f assets/README_IMAGE_FIX.txt assets/CANONICAL_ASSETS.md
          find .github/workflows -maxdepth 1 -type f -name '*.yml' ! -name 'canonical-finalize.yml' -delete
          rm -f .github/workflows/canonical-finalize.yml
          rm -f scripts/canonical_finalize.py

      - name: Commit stable canonical portfolio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: establish stable canonical portfolio and remove regressions'
          git push origin HEAD:main

# stable gate exact portrait v5
