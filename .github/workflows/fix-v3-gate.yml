name: Fix v3 quality gate
on:
  push:
    paths:
      - '.github/workflows/fix-v3-gate.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct Arabic conference-card count
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/apply-final-portfolio-v3.yml')
          t=p.read_text(encoding='utf-8')
          old="assert t.count('رئيسة لجنة المؤتمر') >= 5"
          new="assert t.count('رئيسة لجنة المؤتمر') >= 4"
          if old not in t:
              raise SystemExit('target gate not found')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/apply-final-portfolio-v3.yml
          git commit -m 'fix: correct Arabic conference quality gate'
          git push origin HEAD:main