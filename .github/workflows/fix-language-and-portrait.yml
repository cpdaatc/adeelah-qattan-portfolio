# Pages refresh after approved portrait replacement
name: Fix portfolio language isolation and portrait

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-language-and-portrait.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved portrait image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          gh api repos/${{ github.repository }}/git/blobs/dca44423b2f02ab41e558730923bdd1e0f0d1306 --jq '.content' | tr -d '\n' | base64 -d > assets/portrait.jpg
          file assets/portrait.jpg
          test -s assets/portrait.jpg

      - name: Verify portfolio language isolation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          required = [
              'html[lang="en"] .ar{display:none!important}',
              'html[lang="ar"] .en{display:none!important}',
              'src="assets/portrait.jpg"'
          ]
          missing = [item for item in required if item not in s]
          if missing:
              raise SystemExit('Missing required portfolio safeguards: ' + ', '.join(missing))
          PY

      - name: Commit approved portrait
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portrait.jpg
          git commit -m "fix: replace portrait with approved uploaded image"
          git push
