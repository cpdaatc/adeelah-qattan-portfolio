name: Finalize mobile actions v2

on:
  push:
    paths:
      - '.github/workflows/finalize-mobile-actions-v2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch certificate
        run: python -c "from pathlib import Path; import base64,re; p=Path('index.html'); t=p.read_text(encoding='utf-8'); old=base64.b64decode('').decode(); new=base64.b64decode('').decode(); assert old in t; t=t.replace(old,new,1); t=re.sub(r'\.royal-image-link\{[^}]*\}','',t,count=1); t=re.sub(r'(\.royal-document\{[^}]*?max-width:)300px',r'\g<1>420px',t,count=1); t=re.sub(r'(\.royal-document img\{[^}]*?height:auto;)',r'\1object-fit:contain;',t,count=1); t=re.sub(r'\.royal-document figcaption small\{[^}]*\}','',t,count=1); t=t.replace('.royal-grid{grid-template-columns:minmax(280px,300px) 1fr}','.royal-grid{grid-template-columns:minmax(340px,420px) 1fr}',1); t=t.replace('.royal-document{max-width:300px;margin:auto}','.royal-document{max-width:420px;margin:auto}',1); p.write_text(t,encoding='utf-8')"
      - name: Verify
        run: |
          grep -q 'King_Fahd_Medal_Third_Degree_2019.jpg?v=20260814-12' index.html
          ! grep -q 'Tap or click the image' index.html
          ! grep -q 'royal-image-link' index.html
          ! grep -q 'King_Fahd_Medal_Closeup_2019.jpg' index.html
          echo verified
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: display complete King Fahd certificate only'
          git push origin HEAD:main